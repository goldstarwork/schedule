<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>金星工作站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="config.js"></script>
<script src="https://res.cdn.office.net/teams-js/2.58.0/js/MicrosoftTeams.min.js" integrity="sha384-sMo/EOqQPa1OCup2/VBRum7oFeOS22kvs8WGDc45xK53tUVZzFR5WwFYDUYN1LO4" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script>if(!window.msal)document.write('<script src="https://unpkg.com/@azure/msal-browser@3/lib/msal-browser.min.js"><\/script>')</script>
<script>if(!Array.prototype.at){Object.defineProperty(Array.prototype,'at',{value:function(n){n=Math.trunc(n)||0;if(n<0)n+=this.length;return this[n];},configurable:true,writable:true});}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky control bar, then a month of day blocks; each job is one row — time rail on the left, crew + vehicles on the right */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#1b2220; --muted:#5f6a66; --line:#d9dfdc;
  --accent:#1d55b8; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#b92f25; --bad-bg:#fde6e3; --today:#1d55b8;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a1f1e; --surface-2:#202625; --ink:#e6ebe9; --muted:#97a29e; --line:#2d3533;
  --accent:#7ea6ff; --accent-ink:#0c1630; --accent-soft:#1d2a47;
  --warn:#f2b552; --warn-bg:#3a2b10; --bad:#ff8f84; --bad-bg:#3e1c19; --today:#7ea6ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a1f1e; --surface-2:#202625; --ink:#e6ebe9; --muted:#97a29e; --line:#2d3533;
  --accent:#7ea6ff; --accent-ink:#0c1630; --accent-soft:#1d2a47;
  --warn:#f2b552; --warn-bg:#3a2b10; --bad:#ff8f84; --bad-bg:#3e1c19; --today:#7ea6ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;margin-right:auto}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap;flex:none}
@media (max-width:520px){.tabs button{padding:5px 9px}}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:0 10px}
.mnav{display:flex;align-items:center;gap:4px}
.mnav b{font-family:var(--font-num);font-size:15px;min-width:92px;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;font-size:16px;line-height:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:14px}
select.ghost{padding-right:6px}
.status{font-size:13px;color:var(--muted);margin-left:auto}
.status.err{color:var(--bad)}

main{padding-block:14px 80px;zoom:var(--zoom,1)}
.viewctl{display:flex;align-items:center;gap:10px}
.zoomctl{display:flex;align-items:center;gap:6px}
.zoomctl input[type=range]{width:120px;accent-color:var(--accent);cursor:pointer}
.zl{font-size:11px;color:var(--muted);font-weight:700;line-height:1}
.zl.big{font-size:17px}
.zv{display:inline-flex;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px 2px 2px;font-family:var(--font-num);font-size:13px;color:var(--muted);cursor:text}
.zv:focus-within{border-color:var(--accent)}
.zv input[type=text]{border:0;border-radius:0;background:none;width:2.2em;min-width:0;text-align:right;font-family:var(--font-num);font-size:13px;color:var(--ink);padding:1px 0;outline:none}
#fullw[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#rolebtn[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
body.full .wrap{max-width:none}
@media (max-width:1000px){.wideonly{display:none}}
@media (max-width:480px){.zoomctl input[type=range]{width:90px}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.day.empty{background:transparent;border-style:dashed}
.day.today{border-color:var(--today);box-shadow:0 0 0 1px var(--today)}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.day.empty .dhead{background:transparent;border-bottom:0;padding-block:6px}
.dlabel{display:flex;align-items:baseline;gap:8px;min-width:96px}
.dlabel .dd{font-family:var(--font-num);font-weight:600;font-size:16px}
.dlabel .wd{color:var(--muted);font-size:14px}
.dlabel .wd.we{color:var(--bad)}
.tag-today{font-size:12px;background:var(--today);color:var(--accent-ink);border-radius:4px;padding:0 6px}
.leave{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.leave.office{color:var(--accent)}
.leave.office .lv{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.pg .ofc{display:block;color:var(--accent);font-size:12px}
.leave .lv{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink)}
.dact{margin-left:auto;display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 10px;font-size:13px;color:var(--muted)}
.mini.add{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.issues{list-style:none;margin:0;padding:8px 14px;display:grid;gap:4px;border-bottom:1px solid var(--line);font-size:13px}
.issues li{display:flex;gap:8px;align-items:flex-start}
.issues .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.issues .bad .dot{background:var(--bad)} .issues .bad{color:var(--bad)}
.issues .check .dot{background:var(--warn)} .issues .check{color:var(--warn)}

.job{display:grid;grid-template-columns:92px 1fr auto;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);transition:background .12s}
.job:first-of-type{border-top:0}
.issues + .job{border-top:0}
.job:hover{background:var(--surface-2)}
.job.dim{opacity:.38}
.jt{font-family:var(--font-num);font-size:14px;font-weight:600;line-height:1.3}
.jt small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
.jt .none{color:var(--line);font-weight:500}
.jm{min-width:0;display:grid;gap:5px}
.jm h3{margin:0;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--font-num);font-size:12px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chips .k{font-size:12px;color:var(--muted);width:28px;flex:none}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:1px 8px;font-size:14px;background:var(--accent-soft);color:var(--ink);border:1px solid transparent}
.chip.v{background:var(--surface-2);border-color:var(--line)}
.chip.x{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip.me{background:var(--accent);color:var(--accent-ink)}
.chip.lead{color:var(--bad);font-weight:700}
.chip.me.lead{color:var(--accent-ink)}
.lpick[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.lpick[aria-pressed="true"] b{font-weight:700}
.pg .cell-job.lead{color:var(--bad);font-weight:700}
.chip.leave,.chip.clash{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chip.check{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.chip sup{font-size:10px;font-family:var(--font-num)}
.jsub{font-size:14px;font-weight:400;color:var(--muted)}
.jaddr{display:inline-flex;align-items:center;gap:8px;margin-left:24px;font-size:13px;font-weight:400;color:var(--muted);min-width:0}
.jaddr .addr{overflow-wrap:anywhere}
.mapbtn{display:inline-flex;align-items:center;gap:3px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:6px;padding:1px 8px;color:var(--accent);text-decoration:none;font-size:12px;white-space:nowrap;background:var(--surface)}
.mapbtn:hover{background:var(--accent-soft)}
@media (max-width:560px){.jaddr{margin-left:0;flex-basis:100%}}

.unatt{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);font-weight:400}
.note{margin:0;font-size:13px;color:var(--muted)}
.emptymsg{color:var(--muted);font-size:13px}

/* person grid */
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.pg{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.pg th,.pg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 6px;vertical-align:top;min-width:64px}
.pg thead th{position:sticky;top:0;background:var(--surface-2);font-weight:500;text-align:center;font-family:var(--font-num);white-space:nowrap}
.pg thead th small{display:block;font-family:var(--font-body);color:var(--muted)}
.pg th.name{position:sticky;left:0;z-index:1;background:var(--surface-2);text-align:left;min-width:64px;white-space:nowrap;font-family:var(--font-body)}
.pg thead th.name{z-index:2}
.pg .tcol{background:var(--accent-soft)}
.pg .cell-job{display:block;background:var(--accent-soft);border-radius:4px;padding:0 4px;margin-bottom:2px;white-space:nowrap;cursor:pointer;border:0;width:100%;text-align:left;font-size:12px}
.pg .cell-job.bad{background:var(--bad-bg);color:var(--bad)}
.pg .cell-job.check{background:var(--warn-bg);color:var(--warn)}
.pg .off{color:var(--muted);font-size:12px}
.pg .cnt{font-family:var(--font-num);color:var(--muted);text-align:center}
.pg tr.pgsec th,.pg tr.pgsec td{background:var(--surface-2);border-bottom:1px solid var(--line);padding:6px 8px}
.pg tr.pgsec th{font-size:13px;font-weight:700;text-align:left;white-space:nowrap}
.pg tr.pgsec th small{display:inline;margin-left:8px;font-weight:400;color:var(--muted);font-family:var(--font-body)}
.pg .cell-job .cj-n{display:block}
.pg .cell-job .cj-t{display:block;font-family:var(--font-num);font-size:11px;color:var(--muted);line-height:1.3}
.pg .cell-job.bad .cj-t,.pg .cell-job.check .cj-t{color:inherit;opacity:.85}
.pg .cj-tent{font-style:normal;font-size:10px;border:1px dashed var(--warn);color:var(--warn);border-radius:3px;padding:0 2px;margin-right:3px}

/* settings v2: 人員（寬）+ 車輛（窄）兩區；手機用上方切換 */
.settabs{display:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:12px;width:max-content}
.settabs button{border:0;background:none;padding:5px 18px;border-radius:6px;color:var(--muted);font-weight:500}
.settabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.set2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.ph{margin-bottom:12px}
.ph p{margin:2px 0 0}
.scols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.scol{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);min-width:0;transition:border-color .1s,background .1s}
.scol.drop-col{border-color:var(--accent);background:var(--accent-soft)}
.scol-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px}
.scol-h b{font-size:14px}
.scol-h span{font-size:12px;color:var(--muted);font-family:var(--font-num)}
.scards{display:grid;gap:6px}
.scard{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 4px;min-height:40px}
.scard.dragging{opacity:.35}
.scard.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.scard.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.scard.ghost{position:fixed;z-index:40;pointer-events:none;box-shadow:0 8px 24px rgb(0 0 0 / .18);border-color:var(--accent)}
.scard.editing{padding:6px}
.scard.editing input{flex:1;min-width:0;padding:4px 8px}
.handle{cursor:grab;touch-action:none;color:var(--muted);font-size:13px;letter-spacing:-2px;padding:6px 4px;user-select:none}
.handle:active{cursor:grabbing}
.scard .sname{flex:1;min-width:0;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .scount{font-size:12px;color:var(--muted);font-family:var(--font-num)}
.more{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:16px;line-height:1}
.more:hover,.scard.open .more{background:var(--surface-2);color:var(--ink)}
.smenu{position:absolute;right:4px;top:calc(100% + 4px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0 / .14);padding:4px;display:grid;min-width:132px}
.smenu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;font-size:14px}
.smenu button:hover{background:var(--surface-2)}
.smenu .del{color:var(--bad)}
.smenu .del.armed{background:var(--bad-bg);font-weight:500}
.addchip{border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));background:none;color:var(--accent);border-radius:8px;padding:6px 10px;font-size:14px;text-align:left}
.addchip:hover{background:var(--accent-soft)}
.addin{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.addin input{flex:1;min-width:6em;padding:5px 8px;border-color:var(--accent)}
.clist{padding:10px 0;border-top:1px solid var(--line)}
.clist:first-of-type{border-top:0;padding-top:0}
.clist-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:8px}
.clist-h b{font-size:14px}
.clist-h span{font-size:12px;color:var(--muted)}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipsrow .addchip{padding:3px 12px}
.chipsrow .addin{flex-basis:100%}
.tchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 3px 2px 10px;font-size:14px;background:var(--surface-2)}
.tchip button{border:0;background:none;color:var(--muted);min-width:22px;height:22px;border-radius:999px;font-size:13px;padding:0 4px}
.tchip button:hover{background:var(--bad-bg);color:var(--bad)}
.tchip .tname{color:var(--ink);font-size:14px;padding:0 2px;min-width:0;height:auto;border-radius:4px;cursor:text}
.tchip .tname:hover{background:none;color:var(--accent);text-decoration:underline dotted}
.ledit{flex-basis:100%}
.tchip.armed{border-color:var(--bad);background:var(--bad-bg)}
.tchip.armed button{color:var(--bad);font-weight:500}
@media (max-width:760px){
  .settabs{display:flex}
  .set2{grid-template-columns:1fr}
  .set2.show-people .veh,.set2.show-veh .ppl{display:none}
}
@media (max-width:420px){.scols{grid-template-columns:1fr}}
/* 人員管理改成橫向：每一組一列，名字由左到右排，排滿自動換行 */
.scols{grid-template-columns:1fr;gap:10px}
.scol{padding:10px 12px}
.scol-h{align-items:center;padding:0 2px 8px}
.scol-h .sfilter{margin-left:auto;width:9em;padding:3px 8px;font-size:13px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.scards{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scard{min-height:34px;padding:2px 2px 2px 0;gap:3px}
.scard .handle{padding:4px 1px 4px 4px}
.scard .sname{flex:none;font-size:14px;max-width:10em}
.scard .leadn{display:inline;margin-left:4px}
.scard .scount{font-size:11px}
.scard .more{width:24px;height:24px}
.scard.editing{flex:1 1 100%;max-width:420px}
.scard.drop-before{box-shadow:-3px 0 0 0 var(--accent)}
.scard.drop-after{box-shadow:3px 0 0 0 var(--accent)}
.scards .addchip{padding:5px 10px}
.scards .addin{flex:1 1 220px}
.scard.hid{display:none}
.scard .smenu button{white-space:nowrap}

/* settings */
.set{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h2{margin:0 0 4px;font-size:16px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:13px}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pitem{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:14px;background:var(--surface-2)}
.pitem button{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%}
.pitem button:hover{background:var(--bad-bg);color:var(--bad)}
.slist{display:grid;border-top:1px solid var(--line)}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow.editing input{flex:1;min-width:120px}
.sname{font-weight:500;font-size:15px;min-width:56px}
.scount{font-size:12px;color:var(--muted);font-family:var(--font-num)}
.sbtns{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.icon-btn.sm{width:28px;height:28px;font-size:14px}
.icon-btn:disabled{opacity:.3;cursor:default}
.mini.del{color:var(--bad)}
.mini.armed{background:var(--bad-bg);border-color:var(--bad)}
.grp{font-size:12px;color:var(--muted);margin:8px 0 4px;letter-spacing:.06em}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow input{flex:1;min-width:100px}
input[type=text],input[type=date],input[type=time],textarea,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:56px}
.btn{border:0;border-radius:8px;padding:8px 16px;font-weight:500;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

const WD = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
const ds = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ds(d.getFullYear(), d.getMonth(), d.getDate()); };
const todayStr = () => { const d = new Date(); return ds(d.getFullYear(), d.getMonth(), d.getDate()); };
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const md = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

const S = {
  db: null, canWrite: true, jobs: new Map(), days: new Map(), trash: new Map(), km: new Map(), times: new Map(), vrec: new Map(), stays: new Map(), page: 'sched', fleetV: null, fleetKind: '全部', me: null, meId: '',
  config: { staff: [], vehicles: [], extCompanies: [], carTypes: [], vehicleService: {}, vehicleServiceDate: {}, vehicleInfo: {}, fleetTerms: {}, kmTol: 3, accounts: [] }, view: 'day',

let DR = null;

  e.preventDefault();
  const card = h.closest('.scard'); const r = card.getBoundingClientRect();
  const ghost = card.cloneNode(true); ghost.classList.add('ghost');
  Object.assign(ghost.style, { width: r.width + 'px', left: r.left + 'px', top: r.top + 'px' });
  document.body.appendChild(ghost); card.classList.add('dragging');

  document.querySelectorAll('.drop-before,.drop-after,.drop-col').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-col'));
  DR.ghost.style.display = 'none'; const el = document.elementFromPoint(e.clientX, e.clientY); DR.ghost.style.display = '';
  const card = el && el.closest('.scard:not(.dragging)'); const col = el && el.closest('.scol');
  if (card && card.dataset.name) {
    const r = card.getBoundingClientRect(); const before = e.clientX < r.left + r.width / 2; // 橫向排列：看左半邊還是右半邊
    card.classList.add(before ? 'drop-before' : 'drop-after');
    DR.target = { group: card.closest('.scol').dataset.group, ref: card.dataset.name, before };
  } else if (col) { col.classList.add('drop-col'); DR.target = { group: col.dataset.group, ref: null }; }

});
function endDrag() {

  if (!d.target) return;

  const p = { ...st[i], group: d.target.group }; st.splice(i, 1);

  st.splice(at, 0, p);

async function saveJob() {
  readForm();
  if (!F.title) { $('#f-title').focus(); toast('請填場次名稱'); return; }
  if (F.end && F.start && toMin(F.end) === toMin(F.start)) { toast('開始和結束時間不能一樣'); return; }
  if (isOvernight(F) && F.overnightOk !== F.start + '-' + F.end) { askOvernight(); return; }
  const dates = rangeDates(F.date, F.dateEnd);
  if (dates.length > 62) { toast('一次最多排 62 天'); return; }
  $('#b-save').disabled = true;
  const nextOrder = d => Math.max(0, ...jobsOn(d).map(j => j.order || 0)) + 1;
  const orig = F.id ? S.jobs.get(F.id) : null;
  const lodgeRun = orig && F.lodging && !orig.lodging ? sameRun(orig).filter(x => x.id !== F.id && !x.lodging) : [];
  const ok = await write(async () => {
    for (const x of lodgeRun) await S.db.doc('jobs/' + x.id).update({ lodging: true }); // 打開住宿：同一個案子的其他天一起打開
    for (const [i, d] of dates.entries()) {
      const isSelf = i === 0 && F.id;
      const body = i === 0
        ? jobBody({ ...F, date: d, order: isSelf ? F.order : nextOrder(d) })
        : jobBody({ date: d, title: F.title, address: F.address, order: nextOrder(d), start: '', end: '', timeNote: '', people: [], leaders: [], vehicles: [], ext: [], note: '', unattended: false, tentative: !!F.tentative, lodging: !!F.lodging }); // 其他天只建場次，人和車每天不同
      await (isSelf ? S.db.doc('jobs/' + F.id) : S.db.collection('jobs').doc()).set(body);
    }
  }, dates.length > 1 ? `已建立 ${md(dates[0])}–${md(dates.at(-1))} 共 ${dates.length} 天的場次，其他天的人員和車輛請各自排` : '已儲存');
  if (ok) { const ext = F.ext; closeEditor(); await learnExt(ext); askRosterAdd(ext); } else if ($('#b-save')) $('#b-save').disabled = false;
}
// 同名場次、日期連續的一整段（例如 Ultra 11/9–11/14），中間斷掉就不算同一個案子
function sameRun(job) {
  const title = (job.title || '').trim(); if (!title) return [job];
  const on = d => jobsOn(d).filter(j => (j.title || '').trim() === title);
  const out = [...on(job.date)];
  for (let d = addDays(job.date, -1), n = 0; n < 366; d = addDays(d, -1), n++) { const js = on(d); if (!js.length) break; out.push(...js); }
  for (let d = addDays(job.date, 1), n = 0; n < 366; d = addDays(d, 1), n++) { const js = on(d); if (!js.length) break; out.push(...js); }
  return out.length ? out : [job];
}
function rangeDates(a, b) {
  const out = [a]; if (!b || b <= a) return out;
  let d = a; while (d < b && out.length < 63) { d = addDays(d, 1); out.push(d); }
  return out;
}

/* ---------- 休假 / 公司 editor ---------- */
let L = null;
function openLeave(date, kind = 'leave') {
  const label = kind === 'office' ? '在公司' : '休假';
  L = { date, kind, leave: [...(kind === 'office' ? officeOn(date) : leaveOn(date))] };
  // 休假從正職和行政挑選，公司只從正職挑選（行政本來就在公司）；以前選過的人仍會列出，方便取消
  const names = activeStaff().filter(p => { const g = p.group || '正職'; return g === '正職' || (kind !== 'office' && g === '行政'); }).map(p => p.name);
  const sh = $('#sheet');
  const draw = () => {
    const assigned = new Set(jobsOn(date).flatMap(j => j.unattended ? [] : (j.people || [])));
    const other = kind === 'office' ? leaveOn(date) : officeOn(date);
    sh.querySelector('#lv-picks').innerHTML = [...new Set([...names, ...L.leave])].map(n => {
      const on = L.leave.includes(n);
      const hint = [assigned.has(n) ? '當天有排' : '', other.has(n) ? (kind === 'office' ? '休假' : '在公司') : ''].filter(Boolean).join('、');
      const bad = on && (kind === 'leave' ? (assigned.has(n) || other.has(n)) : other.has(n));
      return `<button type="button" class="pick ${bad ? 'leave' : ''}" data-act="lvpick" data-name="${esc(n)}" aria-pressed="${on}"><b>${esc(n)}</b>${hint ? `<i>${hint}</i>` : ''}</button>`;
    }).join('') || '<span class="hint">到「人員管理」新增正職人員。</span>';
  };
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="lv-h">
    <h2 id="lv-h">${md(date)} 週${WD[parseD(date).getDay()]} ${label}<button class="icon-btn x" data-act="close" aria-label="關閉">×</button></h2>
    ${kind === 'office' ? '<p class="hint" style="margin:0">勾選這天留在公司的正職。</p>' : ''}
    <div class="picks" id="lv-picks"></div>
    <div class="acts"><span class="sp"></span><button class="btn" data-act="lvsave" id="b-lv">儲存</button></div>
  </div>`;
  sh.hidden = false; L.draw = draw; draw();
}

/* ---------- 刪除先進「最近刪除」，30 天內都能復原 ---------- */
async function trashJobs(jobs, msg) {
  jobs = jobs.filter(Boolean); if (!jobs.length) return false;
  const batch = Date.now().toString(36), now = Date.now();
  const old = [...S.trash.values()].filter(t => now - (t.deletedAt || 0) > 30 * 864e5);
  const ok = await write(async () => {
    for (const j of jobs) {
      const { id, ...data } = j;
      await S.db.doc('trash/' + id).set({ job: data, deletedAt: now, batch });
      await S.db.doc('jobs/' + id).delete();
    }
    for (const t of old) await S.db.doc('trash/' + t.id).delete();
  });
  if (ok) toast(msg, () => restoreJobs(jobs.map(j => j.id), jobs));
  return ok;
}
async function restoreJobs(ids, captured) {
  const cap = new Map((captured || []).map(j => { const { id, ...job } = j; return [id, { id, job }]; }));
  const items = ids.map(id => S.trash.get(id) || cap.get(id)).filter(Boolean);
  if (!items.length) { toast('找不到要復原的場次'); return; }
  await write(async () => {
    for (const t of items) { await S.db.doc('jobs/' + t.id).set(t.job); await S.db.doc('trash/' + t.id).delete(); }
  }, items.length > 1 ? `已復原 ${items.length} 個場次` : `已復原「${items[0].job.title}」`);
  if (TR) openTrash();
}
let TR = false;
function openTrash() {
  if (S.canWrite === false) return;
  TR = true;
  const list = [...S.trash.values()].sort((a, b) => b.deletedAt - a.deletedAt);
  const batches = []; const seen = new Map();
  list.forEach(t => { if (!seen.has(t.batch)) { seen.set(t.batch, []); batches.push(seen.get(t.batch)); } seen.get(t.batch).push(t); });
  const when = ms => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const sh = $('#sheet');
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="tr-h">
    <h2 id="tr-h">最近刪除<button class="icon-btn x" data-act="trclose" aria-label="關閉">×</button></h2>
    <p class="hint" style="margin:0">刪除的場次會保留 30 天，按「復原」就會放回原本的日期。</p>
    ${batches.length ? `<div class="trlist">${batches.map(b => {
      const dates = [...new Set(b.map(t => t.job.date))].sort();
      const range = dates.length > 1 ? `${md(dates[0])}–${md(dates.at(-1))}（${dates.length} 天）` : md(dates[0]);
      return `<div class="tritem">
        <div class="trmain"><b>${esc(b[0].job.title || '（未命名）')}</b><span>${range}</span></div>
        <span class="trwhen">${when(b[0].deletedAt)} 刪除</span>
        ${S.canWrite === false ? '' : `<button class="btn sm" data-act="trrestore" data-ids="${esc(b.map(t => t.id).join(','))}">復原</button>`}
      </div>`; }).join('')}</div>` : '<p class="emptymsg">沒有刪除的場次。</p>'}
  </div>`;
  sh.hidden = false;
}

const PERMS = [

  ['timeSelf', '填自己的時間', '要先對應到排班人員'],
  ['timeSupport', '填支援人員時間', '可以幫任一位支援人員填'],
  ['viewTime', '看大家的時間', '班表上看得到所有人填的時間'],
  ['editTime', '改大家的時間', '看得到也能修改任何人填的時間（不用有排班編輯）'],
  ['km', '登記用車里程', '點車輛登記里程、事務用車'],
  ['export', '匯出班表', 'PNG／PDF'],
  ['fleet', '車輛管理', '車輛管理頁：新增車輛、改別名與車號，記保險、保養、維修、驗車、稅費'],

  ['viewLodge', '查看住宿', '點場次的住宿按鈕，看飯店、地址、電話、訂房代號、分房（看不到費用）'],
  ['lodging', '編輯住宿', '場次的住宿資訊：飯店、訂房、費用、分房'],
  ['admin', '權限管理', '打開這一頁設定大家的權限']
];
const can = p => !!(S.me && S.me.perms && S.me.perms.includes(p));
const isSupport = n => S.config.staff.some(p => p.name === n && (p.group === '支援' || p.group === '團隊'));
const isTeam = n => S.config.staff.some(p => p.name === n && p.group === '團隊');
const GLABEL = { '正職': '正職', '行政': '行政', '支援': '支援・個人', '團隊': '支援・團隊' };
const teamText = t => `${t.name} ${t.count || 0}人`;
const teamNames = t => (t.members || []).filter(Boolean);
const canFillTime = n => can('edit') || can('editTime') || (can('timeSelf') && !!S.me.staff && S.me.staff === n) || (can('timeSupport') && isSupport(n));
// 跟正式版 SharePoint 的規則一樣：沒有「看大家的時間」的人，只看得到自己建立的紀錄
// 填寫人是誰：先用帳號代碼比對，對不到再用信箱、姓名比對（SharePoint 回傳的建立者代碼有時跟群組名單不一樣）
const lcs = x => String(x || '').trim().toLowerCase();
const accOf = r => { if (!r) return null; const L = S.config.accounts || [];
  return (r.byId && L.find(x => x.id === r.byId)) || (r.byMail && L.find(x => [x.mail, x.upn].some(m => m && lcs(m) === lcs(r.byMail)))) || (r.byAuthor && L.find(x => x.name === r.byAuthor)) || null; };
// 看得到哪些時間：有「看大家／改大家／排班編輯」看全部；其他人看得到自己填的，以及自己能填的那一格（例如別人幫自己代填的、團隊負責人的團隊成員）
const canSeeRec = r => !!r && (can('viewTime') || can('editTime') || can('edit') || (S.me && (r.byId === S.me.id || (accOf(r) || {}).id === S.me.id)) || (r.slot != null ? canFillTeam(r.name) : canFillTime(r.name)));
// 正職的時間只採用本人或排班編輯填的（防止有人繞過 App 幫別的正職亂填）
const leaderOf = team => (S.config.staff.find(p => p.name === team) || {}).leader || '';
// 團隊負責人：可以幫自己團隊的每個人填時間（只限有排到這個團隊的場次）
const isMyTeam = team => !!(S.me && S.me.staff && can('timeSelf') && leaderOf(team) === S.me.staff);
const canFillTeam = team => canFillTime(team) || isMyTeam(team);
const validRec = r => {
  if (!r) return false; const a = accOf(r);
  if (r.slot != null) return !!a && (a.perms.includes('edit') || a.perms.includes('editTime') || a.perms.includes('timeSupport') || (a.perms.includes('timeSelf') && a.staff && a.staff === leaderOf(r.name)));
  if (isSupport(r.name)) return true;
  return !!a && (a.staff === r.name || a.perms.includes('edit') || a.perms.includes('editTime'));
};
const timeKey = (jobId, n) => jobId + '__' + n;
// 同一格有好幾筆時（正式版的 alts），用最新而且有效的那筆
const timeOf = (jobId, n) => { const r = S.times.get(timeKey(jobId, n)); if (!r) return null; return [r, ...(r.alts || [])].filter(x => validRec(x) && canSeeRec(x)).sort((a, b) => (b.at || 0) - (a.at || 0))[0] || null; }; // 本人和有權限的人都填過時，顯示最後改的那筆
const nextDay = d => md(addDays(d, 1));
// 時間顯示：同一天「08:30–17:00」；跨夜「22:00–11/15 02:00」
const timeText = (r, full) => {
  if (!r || !r.start) return '';
  const on = r.end && toMin(r.end) < toMin(r.start);
  if (full) return `${md(r.date)} ${r.start} – ${r.end ? (on ? nextDay(r.date) + ' ' : md(r.date) + ' ') + r.end : '（未填結束）'}`;
  return `${r.start}–${r.end ? (on ? nextDay(r.date) + ' ' : '') + r.end : ''}`;
};

function openTime(jobId, n, slot) {

  const j = S.jobs.get(jobId); if (!j || !(hasSlot ? canFillTeam(n) : canFillTime(n))) return; const key = hasSlot ? n + '#' + slot : n;
  const r = timeOf(jobId, key) || {};
  const tm = hasSlot ? ((j.teams || []).find(t => t.name === n) || {}) : null; const member = hasSlot ? ((tm.members || [])[slot] || '') : '';

    <p class="hint" style="margin:0">${md(j.date)} 週${WD[parseD(j.date).getDay()]}「${esc(j.title || '')}」${isSupport(n) ? '・支援' : ''}</p>
    <div class="field"><span>時間（24 小時制，結束比開始早就是隔天）</span>
      <div class="tline">${timePick('tm-s', r.start || '', '開始')}<span class="to">到</span>${timePick('tm-e', r.end || '', '結束')}</div>

// 誰填過這格：每個人只留他最後改的那次，最新的在上面（畫面顯示的就是最上面那筆）
function timeHist(jobId, key) {
  const raw = S.times.get(timeKey(jobId, key)); if (!raw) return '';
  const list = [raw, ...(raw.alts || [])].filter(x => x && validRec(x) && canSeeRec(x)).sort((a, b) => (b.at || 0) - (a.at || 0));
  if (!list.length) return '';
  const when = t => { if (!t) return ''; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  return `<div class="tmhist"><b>填寫紀錄</b>${list.map((x, i) => `<span class="${i ? '' : 'cur'}"><i>${esc(when(x.at))}</i>${esc(x.byAuthor || x.by || '')} 填 ${esc(x.start)}–${esc(x.end)}${i ? '' : '<em>目前顯示</em>'}</span>`).join('')}</div>`;
}
// 有填但沒採用的時間：告訴有權限的人原因（例如填的人還沒加進團隊、沒有對應這個名字）
function timeDiag(jobId, key, n) {
  if (!(can('edit') || can('editTime') || can('viewTime'))) return '';
  const raw = S.times.get(timeKey(jobId, key)); if (!raw) return '';
  const bad = [raw, ...(raw.alts || [])].filter(x => x && !validRec(x));
  if (!bad.length) return '';
  const why = x => { const a = accOf(x); const who = x.byAuthor || x.by || '某人';
    return !a ? `${esc(who)} 填的 ${esc(x.start)}–${esc(x.end)}：${esc(who)} 不在權限管理的名單裡（還沒加進「金星工作站」團隊）`
      : `${esc(who)} 填的 ${esc(x.start)}–${esc(x.end)}：${esc(who)} 沒有對應「${esc(n)}」，也沒有「排班編輯」或「改大家的時間」`; };
  return `<div class="tmdiag"><b>有 ${bad.length} 筆時間沒有採用</b>${bad.map(x => `<span>${why(x)}</span>`).join('')}<small>在「權限管理」把那位同事對應到正確的名字，或給他權限後就會出現；也可以在這裡直接重填。</small></div>`;

// 上一次的里程讀數：這天以前所有紀錄，加上同一天比這次起始里程小的紀錄（同一天可能有好幾趟）
function prevOdo(v, date, start, selfId) {
  let before = null, same = null;
  const take = (d, x) => { if (x == null || x === '' || isNaN(x)) return; x = +x; if (d < date) { if (before == null || x > before) before = x; } else if (d === date && start != null && x <= start) { if (same == null || x > same) same = x; } };
  for (const r of kmLogs(v)) if (r.id !== selfId) { take(r.date, r.start); take(r.date, r.end); }
  for (const r of S.vrec.values()) if (r.vehicle === v && r.id !== selfId) take(r.date, r.km);
  return { before, prev: same != null ? Math.max(same, before ?? -Infinity) : before };
}
// 回傳要提醒的內容；沒有問題就回傳 null
function kmGap(v, date, start, selfId) {
  if (start == null || !v || !date) return null;
  const { before, prev } = prevOdo(v, date, start, selfId);
  if (before != null && start < before) return { lv: 'back', prev: before, diff: before - start, t: `起始里程 ${kmFmt(start)} 比之前紀錄的 ${kmFmt(before)} km 還少 ${kmFmt(before - start)} km。里程數不會倒退，可能是打錯了，或之前那筆登記錯了。` };
  if (prev != null && start - prev > kmTol()) return { lv: 'gap', prev, diff: start - prev, t: `上一次紀錄的里程是 ${kmFmt(prev)} km，這次起始 ${kmFmt(start)} km，中間差了 ${kmFmt(start - prev)} km（容忍值 ${kmTol()} km）。可能是打錯了，或上一位用車的人沒有登記。` };
  return null;
}
function kmInfo() {

  const sv = num('km-s'), ev = num('km-e');

  if (s != null) parts.push(`保養里程 ${kmFmt(s)} km`);
  if (sv != null && ev != null) parts.push(ev >= sv ? `本次 ${kmFmt(ev - sv)} km` : '<span class="bad">完成里程小於起始里程</span>');
  const reach = Math.max(o ?? -Infinity, ev ?? -Infinity);
  el.innerHTML = parts.join('・') + (s != null && reach >= s ? '　<b class="bad">已到保養里程</b>' : '');
  const date = KM.kind === 'misc' ? $('#km-d')?.value : KM.date; const g = kmGap(v, date, sv, KM.id);
  if (g) el.innerHTML += `<span class="kmgap">⚠ ${esc(g.t)}</span>`;
}

async function saveVehicle(oldN) {
  const newN = ($('#vn-input')?.value || '').trim(); const raw = ($('#vs-input')?.value || '').replace(/[^\d]/g, '');
  if (!newN) { toast('請填車輛名稱'); return; }
  const list = S.config.vehicles || [];
  if (newN !== oldN && list.includes(newN)) { toast(`已經有「${newN}」`); return; }
  const svc = { ...(S.config.vehicleService || {}) }; delete svc[oldN]; if (raw) svc[newN] = +raw;
  const vi = { ...(S.config.vehicleInfo || {}) }; if (newN !== oldN && vi[oldN]) { vi[newN] = vi[oldN]; delete vi[oldN]; }
  const vr = newN === oldN ? [] : [...S.vrec.values()].filter(r => r.vehicle === oldN);
  const jobs = newN === oldN ? [] : [...S.jobs.values()].filter(j => (j.vehicles || []).includes(oldN));
  const logs = newN === oldN ? [] : kmLogs(oldN);
  const ok = await write(async () => {
    await S.db.doc('config/main').set({ ...S.config, vehicles: list.map(x => x === oldN ? newN : x), vehicleService: svc, vehicleInfo: vi });
    for (const j of jobs) await S.db.doc('jobs/' + j.id).update({ vehicles: j.vehicles.map(x => x === oldN ? newN : x) });
    for (const r of logs) await S.db.doc('mileage/' + r.id).update({ vehicle: newN });
    for (const r of vr) await S.db.doc('vrecords/' + r.id).update({ vehicle: newN });
  }, newN !== oldN && (jobs.length || logs.length) ? `已更新，連同 ${jobs.length} 個場次、${logs.length} 筆里程` : '已更新車輛');
  if (ok) { S.editing = null; render(); }
}

// 目前已確定（不是預排）、今天以後的場次

const nfDay = d => `${md(d)}（${WD[parseD(d).getDay()]}）`;

function nfDescribe(id, a, b) {
  const per = {}; const add = (n, t) => (per[n] ||= []).push(t);
  let line, day;

    day = b.date; line = `${nfName(b)}：新增場次${b.people.length ? '（' + b.people.join('、') + '）' : ''}`;
    b.people.forEach(n => add(n, `新增排班 ${nfDay(b.date)}${nfName(b)}`));
  } else if (!b) {
    day = a.date; line = `${nfName(a, false)}：取消`;
    a.people.forEach(n => add(n, `${nfDay(a.date)}${nfName(a, false)} 取消`));
  } else {
    day = a.date !== b.date ? a.date : b.date;
    const common = [];
    if (a.date !== b.date) common.push(`日期改成 ${nfDay(b.date)}`);
    if (a.title !== b.title) common.push(`名稱改成 ${b.title}`);
    if (a.start !== b.start || a.end !== b.end) common.push(`時間改成 ${nfTime(b)}（原本${nfTime(a)}）`);
    if (a.address !== b.address) common.push(b.address ? `地址改成 ${b.address}` : '取消地址');
    if (a.vehicles.join('、') !== b.vehicles.join('、')) common.push(`車輛改成 ${b.vehicles.join('、') || '無'}`);
    if (a.teams.join('、') !== b.teams.join('、')) common.push(`支援團隊改成 ${b.teams.join('、') || '無'}`);
    if (a.ext && b.ext && a.ext.join('、') !== b.ext.join('、')) common.push(`外調車輛 ${b.ext.join('、') || '取消車號'}`);
    const inn = b.people.filter(n => !a.people.includes(n)), out = a.people.filter(n => !b.people.includes(n));
    const stay = b.people.filter(n => a.people.includes(n));

    if (inn.length) all.push(`新增排班 ${inn.join('、')}`);
    if (out.length) all.push(`取消排班 ${out.join('、')}`);

    line = `${nm}：${all.join('；')}`;
    inn.forEach(n => add(n, `新增排班 ${nfDay(b.date)}${nfName(b)}`));
    out.forEach(n => add(n, `取消排班 ${nfDay(a.date)}${nm}`));

// 住宿也列入通知：比對飯店、地址、日期和分房（費用、訂房代號不通知）
function staySig(st) {
  const j = stayJob(st);
  return { title: (j && j.title) || st.title || '', hotel: st.hotel || '', address: st.address || '', phone: st.phone || '', checkIn: st.checkIn || '', checkOut: st.checkOut || '',
    rooms: (st.rooms || []).map(r => ({ no: r.no || '', guests: [...(r.guests || [])], from: r.from || '', to: r.to || '' })) };
}
function confirmedStays() {
  const o = {}, today = todayStr();
  for (const st of S.stays.values()) { const j = stayJob(st); if (j && !j.tentative && (st.checkOut || st.checkIn || '') >= today) o[st.id] = staySig(st); }

}
const roomOf = (st, n) => (st.rooms || []).find(r => (r.guests || []).includes(n));
// 受影響的人：有分房就看住客，還沒分房就看這段日期排到的人
function stayPeople(st) {
  const g = (st.rooms || []).flatMap(r => r.guests || []); if (g.length) return [...new Set(g)];
  const j = stayJob(st); if (!j) return [];
  return [...new Set(sameRun(j).filter(x => x.date >= st.checkIn && x.date <= (st.checkOut || st.checkIn)).flatMap(x => x.people || []))];
}
function roomText(st, n) { const r = roomOf(st, n); if (!r) return ''; return `${r.no ? '房間 ' + r.no : ''}${r.from || r.to ? `（${r.from ? md(r.from) + ' 入住' : ''}${r.from && r.to ? '，' : ''}${r.to ? md(r.to) + ' 先退房' : ''}）` : ''}`; }
function nfDescribeStay(id, a, b) {
  const s0 = b || a; const j = stayJob(s0); const tt = (j && j.title) || s0.title || '';
  const per = {}; const add = (n, t) => (per[n] ||= []).push(t);
  const span = st => `${nfDay(st.checkIn)}入住 → ${st.checkOut ? nfDay(st.checkOut) + '退房' : '退房日未定'}`;
  let line;
  if (!a) {
    line = `${tt} 住宿：${b.hotel}（${md(b.checkIn)} 入住 → ${b.checkOut ? md(b.checkOut) + ' 退房' : '退房日未定'}）`;
    stayPeople(b).forEach(n => { const rt = roomText(b, n); add(n, `住宿 ${tt}：${b.hotel} ${span(b)}${rt ? '，' + rt : ''}`); });
  } else if (!b) {
    line = `${tt} 住宿：取消 ${a.hotel}`;
    stayPeople(a).forEach(n => add(n, `住宿 ${tt}：${a.hotel} 取消`));
  } else {
    const common = [];
    if (a.hotel !== b.hotel) common.push(`飯店改成 ${b.hotel}`);
    if (a.address !== b.address) common.push(`地址改成 ${b.address || '未填'}`);
    if (a.phone !== b.phone) common.push(`電話改成 ${b.phone || '未填'}`);
    if (a.checkIn !== b.checkIn) common.push(`入住改成 ${nfDay(b.checkIn)}`);
    if (a.checkOut !== b.checkOut) common.push(`退房改成 ${b.checkOut ? nfDay(b.checkOut) : '未定'}`);
    const pa = stayPeople(a), pb = stayPeople(b);

    line = `${tt} 住宿 ${a.hotel}：${all.join('；')}`;

      const c = [...common]; if (roomCh.includes(n)) c.push(roomText(b, n) || '房間未定');

// 跟上次通知比，有哪些場次變了（改來改去又改回原樣的不算）
function pendingChanges() {
  if (!S.notify) return [];
  const base = S.notify.jobs || {}, cur = confirmedNow(), today = todayStr(), out = [];
  const ids = new Set([...Object.keys(base).filter(id => (base[id].date || '') >= today), ...Object.keys(cur)]);
  for (const id of ids) {
    const a = base[id] && base[id].date >= today ? base[id] : null, b = cur[id] || null;
    if (!a && !b) continue;
    if (a && b && JSON.stringify(a) === JSON.stringify(a.ext ? b : { ...b, ext: undefined })) continue; // 舊的通知紀錄沒有外調車，不算異動
    out.push(nfDescribe(id, a, b));
  }
  const sb = S.notify.stays || {}, sc = confirmedStays();
  for (const id of new Set([...Object.keys(sb).filter(id => (sb[id].checkOut || sb[id].checkIn || '') >= today), ...Object.keys(sc)])) {
    const a = sb[id] && (sb[id].checkOut || sb[id].checkIn || '') >= today ? sb[id] : null, b = sc[id] || null;
    if (!a && !b) continue;
    if (a && b && JSON.stringify(a) === JSON.stringify(b)) continue;
    out.push(nfDescribeStay(id, a, b));
  }
  return out.sort((x, y) => x.date.localeCompare(y.date) || x.text.localeCompare(y.text, 'zh-Hant'));
}

  const sbase = { ...((S.notify && S.notify.stays) || {}) }, scur = confirmedStays();
  for (const i of m.picked) {

    if (cur[i.id]) base[i.id] = cur[i.id]; else delete base[i.id];
  }
  for (const id of Object.keys(base)) if ((base[id].date || '') < today) delete base[id];
  for (const id of Object.keys(sbase)) if ((sbase[id].checkOut || sbase[id].checkIn || '') < today) delete sbase[id];
  // 正式版：真的發到 Teams（測試版沒有 __nfSend，只會記成已通知）

    catch (e) { b.disabled = false; b.textContent = '發送'; toast('發送失敗：' + ((e && (e.userMsg || e.message)) || e)); return; }

const loadScript = src => new Promise((ok, no) => {

const EX = { range: 'all', fmt: 'png', times: false, tent: false };

async function saveBlob(blob, name) {
  // 在 claude.ai 的預覽裡要透過它的下載功能；在 GitHub／Teams 用一般下載
  const dl = window.claude && window.claude.use ? await Promise.resolve(window.claude.use('downloads')).catch(() => null) : null;
  if (dl) { await dl.save({ filename: name, data: blob }); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function doExport() {
  const btn = $('#b-ex'); btn.disabled = true; btn.textContent = '產生中…';
  const { y, m } = S.month; const all = monthDates();
  const dates = EX.range === 'h1' ? all.slice(0, 15) : EX.range === 'h2' ? all.slice(15) : all;
  const part = EX.range === 'h1' ? '上半月' : EX.range === 'h2' ? '下半月' : '整月';
  const fname = `金星工作站-班表-${y}-${pad(m + 1)}-${part}`;
  const root = document.documentElement; const prevTheme = root.getAttribute('data-theme'); const prevFocus = S.focus;
  const wrap = document.createElement('div'); wrap.className = 'exportwrap';
  const box = document.createElement('div'); box.className = 'exportbox'; wrap.appendChild(box);
  try {
    await loadScript(EXPORT_LIBS.img); if (EX.fmt === 'pdf') await loadScript(EXPORT_LIBS.pdf);
    root.setAttribute('data-theme', 'light'); S.focus = ''; EXPORTING = { times: EX.times, tent: EX.tent };
    const stamp = new Date().toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    box.innerHTML = `<div class="exhead"><b>${APP_NAME}・班表</b><span>${y}年${m + 1}月　${md(dates[0])}–${md(dates.at(-1))}</span><small>${stamp} 匯出</small></div>` + renderDays(dates);
    box.querySelectorAll('.day.today').forEach(d => d.classList.remove('today'));
    document.body.appendChild(wrap);
    const scale = 2;
    const canvas = await htmlToImage.toCanvas(box, { pixelRatio: scale, backgroundColor: '#eef1ef', skipFonts: true });
    if (EX.fmt === 'png') {
      await saveBlob(await new Promise(r => canvas.toBlob(r, 'image/png')), fname + '.png');
    } else {
      // A4 分頁：盡量在兩天之間換頁，不把同一天切成兩半
      const top0 = box.getBoundingClientRect().top;
      const ends = [...box.querySelectorAll('.exhead, .day')].map(el => (el.getBoundingClientRect().bottom - top0 + 5) * scale);
      const pdf = await PDFLib.PDFDocument.create();
      const PW = 595.28, PH = 841.89, M = 24, k = (PW - 2 * M) / canvas.width, pageH = (PH - 2 * M) / k;
      for (let start = 0; start < canvas.height - 2;) {
        let end = start + pageH;
        if (end < canvas.height) { const fit = ends.filter(e => e > start + 40 && e <= end).pop(); if (fit) end = fit; }
        end = Math.min(end, canvas.height);
        const slice = document.createElement('canvas'); slice.width = canvas.width; slice.height = Math.ceil(end - start);

        start = end;
      }
      await saveBlob(new Blob([await pdf.save()], { type: 'application/pdf' }), fname + '.pdf');
    }

  } catch (e) {
    if (e && e.code === 'declined') { closeEditor(); toast('已取消下載'); return; }

  }
}

function memoryBackend(seed) {

    async items(k) { await lag(); return (db[k] || []).map(r => ({ ...r, f: { ...r.f } })); },
    async create(k, f) { await lag(); const id = String(n++); (db[k] ||= []).push({ id, f: { ...f }, author: me, editor: me, at: Date.now() }); return id; },
    async patch(k, id, f) { await lag(); const r = (db[k] || []).find(x => x.id === id); if (!r) throw Object.assign(new Error('找不到資料'), { code: 'error' }); Object.assign(r.f, f); r.editor = me; r.at = Date.now(); },

    async members(gid) { await lag(); return (groups[gid] || []).map(id => seed.users.find(u => u.id === id)).filter(Boolean).map(u => ({ ...u, upn: u.mail })); },
    async addMember(gid, uid) { await lag(); (groups[gid] ||= []); if (!groups[gid].includes(uid)) groups[gid].push(uid); },

  };

      for (const p of [...add, ...del]) if (!GID[p]) throw userErr(`config.js 還沒填「${PERM_LABEL[p]}」群組的識別碼，這一格暫時不能改。`);
      try {
        for (const p of add) { await B.addMember(GID[p], a.id); changed = true; }
        for (const p of del) { await B.removeMember(GID[p], a.id); changed = true; }
      } catch (e) {
        if (e.status === 403 || e.status === 401) throw userErr('沒有修改群組的權限。要在這一頁改權限，帳號必須是 Microsoft 365 管理員，或是這些「班表-」群組的擁有者。');
        throw e;
      }
    }
    if (changed) { await loadMyPerms(); await loadAccounts(); }
  }
  async function setStay(id, data) {
    const rec = M.stays.get(id);
    const { hotel, jobId, checkIn, checkOut, ...rest } = data;
    const f = { hotel: hotel || '', key: jobId || '', checkIn: checkIn || '', checkOut: checkOut || '', data: JSON.stringify(rest) };
    let itemId = rec?.itemId;
    if (itemId) await B.patch('stays', itemId, f); else itemId = await B.create('stays', f);
    M.stays.delete(id); M.stays.set('st' + itemId, { itemId, data: clone(data) }); emit('stays');
  }
  async function delStay(id) { const rec = M.stays.get(id); if (!rec) return; await B.remove('stays', rec.itemId); M.stays.delete(id); emit('stays'); }
  async function setNotify(_, data) {
    const f = { title: 'last', data: JSON.stringify(data) };
    if (M.notifyItem) await B.patch('notify', M.notifyItem, f); else M.notifyItem = await B.create('notify', f);
    M.notify = clone(data); emit('notify');
  }
  const handlers = {
    stays: { set: setStay, update: (id, p) => setStay(id, { ...(M.stays.get(id)?.data || {}), ...p }), delete: delStay },
    notify: { set: setNotify, update: (id, p) => setNotify(id, { ...(M.notify || {}), ...p }), delete: async () => {} },
    jobs: { set: setJob, update: (id, p) => { const r = M.jobs.get(id); if (!r) throw Object.assign(new Error('找不到這個場次，可能已被別人刪除'), { code: 'error' }); return setJob(id, { ...r.data, ...p }); }, delete: delJob },
    days: { set: setDay, update: (id, p) => setDay(id, { ...(M.days.get(id)?.data || {}), ...p }), delete: async () => {} },
    trash: { set: setTrash, update: (id, p) => setTrash(id, { ...(M.trash.get(id)?.data || {}), ...p }), delete: delTrash },
    times: { set: setTime, update: (id, p) => setTime(id, { ...(M.times.get(id)?.data || {}), ...p }), delete: delTime },
    mileage: { set: setKm, update: (id, p) => setKm(id, { ...(M.mileage.get(id)?.data || {}), ...p }), delete: delKm },
    vrecords: { set: setVrec, update: (id, p) => { const r = M.vrecords.get(id); if (!r) throw Object.assign(new Error('找不到這筆紀錄，可能已被別人刪除'), { code: 'error' }); return setVrec(id, { ...r.data, ...p }); }, delete: delVrec },
    config: { set: (_, next) => setConfig(next), update: (_, p) => setConfig({ ...cfg(), ...p }), delete: async () => {} }
  };
  const docRef = (c, id) => ({
    id,
    set: data => w(() => handlers[c].set(id, data)),
    update: data => w(() => handlers[c].update(id, data)),
    delete: () => w(() => handlers[c].delete(id)),
    onSnapshot: cb => { subs[c].push(cb); if (last[c] !== undefined) cb(snapOf(c)); return () => {}; }

  return {
    collection: c => ({ doc: id => docRef(c, id || newId()), onSnapshot: cb => { subs[c].push(cb); if (last[c] !== undefined) cb(snapOf(c)); return () => {}; } }),
    doc: path => { const [c, id] = path.split('/'); return docRef(c, id); },
    // 翻到更早的月份：把讀取範圍往前延伸，再讀一次
    need(ds) { if (full || !ds || ds >= from) return; from = ds; setStatus('讀取較早的資料…'); (syncing || Promise.resolve()).then(() => sync()); },
    // 改名之前：先把全部資料讀進來，舊場次也一起改
    async loadAll() {
      if (full) return; full = true; setStatus('讀取全部資料…');
      for (let i = 0; i < 3; i++) { if (syncing) await syncing; if (await load()) { emitAll(); break; } }
      setStatus('已同步');
    },
    async start() {
      // 權限、資料、同事名單同時讀，不用排隊
      const t0 = performance.now(); const lap = w => console.info('[載入]', w, ((performance.now() - t0) / 1000).toFixed(1) + ' 秒');
      const pPerm = loadMyPerms().then(() => lap('權限'));
      const pLoad = (async () => { if (!(await load())) await load(); lap('資料'); })();
      await pPerm;
      const pAcc = loadAccounts().then(() => lap('同事名單'));
      await Promise.all([pLoad, pAcc]);
      sortAccounts();
      emitAll(true); saveCache(true);
      setInterval(() => { if (document.visibilityState === 'visible' && !busy) sync(); }, Math.max(15, +SC.pollSeconds || 30) * 1000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
    }
  };
}

/* ---------- 錯誤訊息翻成看得懂的話 ---------- */
function explain(e) {
  if (e && e.userMsg) return e.userMsg;
  const m = String((e && (e.errorMessage || e.message)) || e || '');
  if (/AADSTS65001|consent_required|AADSTS90094/i.test(m)) return '這個 App 的權限還沒核准。請管理員到 Microsoft Entra 系統管理中心 → 應用程式註冊 → 排班表 → API 權限，按「代表 … 授與管理員同意」。';
  if (/AADSTS50011|redirect_uri/i.test(m)) return '登入網址不符。請在應用程式註冊的「驗證」裡加入這個重新導向 URI：' + redirectUri();
  if (/AADSTS700016|AADSTS90002|AADSTS900023/i.test(m)) return '找不到這個 App 或公司，請檢查 config.js 的 clientId 和 tenantId。';
  if (/user_cancelled|popup_window_error|block/i.test(m)) return '登入視窗被關掉或擋下了，請重新整理頁面再登入一次。';
  return '無法連線：' + m;
}

/* ---------- 把通知發到 Teams（頻道訊息、私訊；用按的人的身分） ---------- */
const htmlOf = t => esc(t).replace(/\n/g, '<br>');
async function sendTeams(B, me, m) {
  const fail = [];
  const call = (method, url, body) => B.raw(method, url, body, { scopes: MSG_SCOPES });
  const teamId = SC.teamGroupId, chId = SC.notifyChannelId;
  if (m.ch) {
    if (isBlank(teamId) || isBlank(chId)) throw userErr('config.js 還沒填「排班」頻道的識別碼（notifyChannelId），頻道訊息發不出去。');
    let content = htmlOf(m.chBody); const mentions = [];
    if (m.at === 'people' && m.mention.length) {
      content += '<br><br>' + m.mention.map((x, i) => { mentions.push({ id: i, mentionText: x.name, mentioned: { user: { id: x.acc.id, displayName: x.acc.name, userIdentityType: 'aadUser' } } }); return `<at id="${i}">${esc(x.name)}</at>`; }).join(' ');
    } else if (m.at === 'channel') {
      mentions.push({ id: 0, mentionText: '排班', mentioned: { conversation: { id: chId, displayName: '排班', conversationIdentityType: 'channel' } } });
      content += '<br><br><at id="0">排班</at>';
    }
    try { await call('POST', `/teams/${teamId}/channels/${encodeURIComponent(chId)}/messages`, { body: { contentType: 'html', content }, mentions }); }
    catch (e) { if (e.status === 403 || e.status === 401) throw userErr('沒有在「排班」頻道發訊息的權限。請管理員確認 App 的 Teams 訊息權限已同意，而且你是團隊成員。'); throw e; }
  }
  if (m.dm) for (const d of m.dms) {
    if (!d.acc || d.acc.id === me.id) continue; // 不能私訊自己
    try {
      const bind = id => ({ '@odata.type': '#microsoft.graph.aadUserConversationMember', roles: ['owner'], 'user@odata.bind': `https://graph.microsoft.com/v1.0/users('${id}')` });
      const chat = await call('POST', '/chats', { chatType: 'oneOnOne', members: [bind(me.id), bind(d.acc.id)] });
      await call('POST', `/chats/${chat.id}/messages`, { body: { contentType: 'html', content: htmlOf(d.text) } });
    } catch (e) { console.warn('私訊失敗', d.to, e); fail.push(d.to); }
  }
  return { fail };
}
