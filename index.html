<style>
/* Layout: sticky control bar, then a month of day blocks; each job is one row — time rail on the left, crew + vehicles on the right */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#1b2220; --muted:#5f6a66; --line:#d9dfdc;
  --accent:#1d55b8; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#b92f25; --bad-bg:#fde6e3; --today:#1d55b8;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a1f1e; --surface-2:#202625; --ink:#e6ebe9; --muted:#97a29e; --line:#2d3533;
  --accent:#7ea6ff; --accent-ink:#0c1630; --accent-soft:#1d2a47;
  --warn:#f2b552; --warn-bg:#3a2b10; --bad:#ff8f84; --bad-bg:#3e1c19; --today:#7ea6ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a1f1e; --surface-2:#202625; --ink:#e6ebe9; --muted:#97a29e; --line:#2d3533;
  --accent:#7ea6ff; --accent-ink:#0c1630; --accent-soft:#1d2a47;
  --warn:#f2b552; --warn-bg:#3a2b10; --bad:#ff8f84; --bad-bg:#3e1c19; --today:#7ea6ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;margin-right:auto}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:0 10px}
.mnav{display:flex;align-items:center;gap:4px}
.mnav b{font-family:var(--font-num);font-size:15px;min-width:92px;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;font-size:16px;line-height:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:14px}
select.ghost{padding-right:6px}
.status{font-size:13px;color:var(--muted);margin-left:auto}
.status.err{color:var(--bad)}

main{padding-block:14px 80px;zoom:var(--zoom,1)}
.viewctl{display:flex;align-items:center;gap:10px}
.zoomctl{display:flex;align-items:center;gap:6px}
.zoomctl input[type=range]{width:120px;accent-color:var(--accent);cursor:pointer}
.zl{font-size:11px;color:var(--muted);font-weight:700;line-height:1}
.zl.big{font-size:17px}
.zv{display:inline-flex;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px 2px 2px;font-family:var(--font-num);font-size:13px;color:var(--muted);cursor:text}
.zv:focus-within{border-color:var(--accent)}
.zv input[type=text]{border:0;border-radius:0;background:none;width:2.2em;min-width:0;text-align:right;font-family:var(--font-num);font-size:13px;color:var(--ink);padding:1px 0;outline:none}
#fullw[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#rolebtn[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
body.full .wrap{max-width:none}
@media (max-width:1000px){.wideonly{display:none}}
@media (max-width:480px){.zoomctl input[type=range]{width:90px}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.day.empty{background:transparent;border-style:dashed}
.day.today{border-color:var(--today);box-shadow:0 0 0 1px var(--today)}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.day.empty .dhead{background:transparent;border-bottom:0;padding-block:6px}
.dlabel{display:flex;align-items:baseline;gap:8px;min-width:96px}
.dlabel .dd{font-family:var(--font-num);font-weight:600;font-size:16px}
.dlabel .wd{color:var(--muted);font-size:14px}
.dlabel .wd.we{color:var(--bad)}
.tag-today{font-size:12px;background:var(--today);color:var(--accent-ink);border-radius:4px;padding:0 6px}
.leave{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.leave.office{color:var(--accent)}
.leave.office .lv{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.pg .ofc{display:block;color:var(--accent);font-size:12px}
.leave .lv{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink)}
.dact{margin-left:auto;display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 10px;font-size:13px;color:var(--muted)}
.mini.add{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.issues{list-style:none;margin:0;padding:8px 14px;display:grid;gap:4px;border-bottom:1px solid var(--line);font-size:13px}
.issues li{display:flex;gap:8px;align-items:flex-start}
.issues .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.issues .bad .dot{background:var(--bad)} .issues .bad{color:var(--bad)}
.issues .check .dot{background:var(--warn)} .issues .check{color:var(--warn)}

.job{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);transition:background .12s}
.job:first-of-type{border-top:0}
.issues + .job{border-top:0}
.job:hover{background:var(--surface-2)}
.job.dim{opacity:.38}
.jt{font-family:var(--font-num);font-size:14px;font-weight:600;line-height:1.3}
.jt small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
.jt .none{color:var(--line);font-weight:500}
.jm{min-width:0;display:grid;gap:5px}
.jm h3{margin:0;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--font-num);font-size:12px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chips .k{font-size:12px;color:var(--muted);width:28px;flex:none}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:1px 8px;font-size:14px;background:var(--accent-soft);color:var(--ink);border:1px solid transparent}
.chip.v{background:var(--surface-2);border-color:var(--line)}
.chip.x{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip.me{background:var(--accent);color:var(--accent-ink)}
.chip.lead{color:var(--bad);font-weight:700}
.chip.me.lead{color:var(--accent-ink)}
.lpick[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.lpick[aria-pressed="true"] b{font-weight:700}
.pg .cell-job.lead{color:var(--bad);font-weight:700}
.chip.leave,.chip.clash{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chip.check{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.chip sup{font-size:10px;font-family:var(--font-num)}
.jsub{font-size:14px;font-weight:400;color:var(--muted)}
.jaddr{display:inline-flex;align-items:center;gap:8px;margin-left:24px;font-size:13px;font-weight:400;color:var(--muted);min-width:0}
.jaddr .addr{overflow-wrap:anywhere}
.mapbtn{display:inline-flex;align-items:center;gap:3px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:6px;padding:1px 8px;color:var(--accent);text-decoration:none;font-size:12px;white-space:nowrap;background:var(--surface)}
.mapbtn:hover{background:var(--accent-soft)}
@media (max-width:560px){.jaddr{margin-left:0;flex-basis:100%}}

.unatt{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);font-weight:400}
.note{margin:0;font-size:13px;color:var(--muted)}
.emptymsg{color:var(--muted);font-size:13px}

/* person grid */
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.pg{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.pg th,.pg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 6px;vertical-align:top;min-width:64px}
.pg thead th{position:sticky;top:0;background:var(--surface-2);font-weight:500;text-align:center;font-family:var(--font-num);white-space:nowrap}
.pg thead th small{display:block;font-family:var(--font-body);color:var(--muted)}
.pg th.name{position:sticky;left:0;z-index:1;background:var(--surface-2);text-align:left;min-width:64px;white-space:nowrap;font-family:var(--font-body)}
.pg thead th.name{z-index:2}
.pg .tcol{background:var(--accent-soft)}
.pg .cell-job{display:block;background:var(--accent-soft);border-radius:4px;padding:0 4px;margin-bottom:2px;white-space:nowrap;cursor:pointer;border:0;width:100%;text-align:left;font-size:12px}
.pg .cell-job.bad{background:var(--bad-bg);color:var(--bad)}
.pg .cell-job.check{background:var(--warn-bg);color:var(--warn)}
.pg .off{color:var(--muted);font-size:12px}
.pg .cnt{font-family:var(--font-num);color:var(--muted);text-align:center}

/* settings v2: 人員（寬）+ 車輛（窄）兩區；手機用上方切換 */
.settabs{display:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:12px;width:max-content}
.settabs button{border:0;background:none;padding:5px 18px;border-radius:6px;color:var(--muted);font-weight:500}
.settabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.set2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.ph{margin-bottom:12px}
.ph p{margin:2px 0 0}
.scols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.scol{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);min-width:0;transition:border-color .1s,background .1s}
.scol.drop-col{border-color:var(--accent);background:var(--accent-soft)}
.scol-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px}
.scol-h b{font-size:14px}
.scol-h span{font-size:12px;color:var(--muted);font-family:var(--font-num)}
.scards{display:grid;gap:6px}
.scard{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 4px;min-height:40px}
.scard.dragging{opacity:.35}
.scard.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.scard.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.scard.ghost{position:fixed;z-index:40;pointer-events:none;box-shadow:0 8px 24px rgb(0 0 0 / .18);border-color:var(--accent)}
.scard.editing{padding:6px}
.scard.editing input{flex:1;min-width:0;padding:4px 8px}
.handle{cursor:grab;touch-action:none;color:var(--muted);font-size:13px;letter-spacing:-2px;padding:6px 4px;user-select:none}
.handle:active{cursor:grabbing}
.scard .sname{flex:1;min-width:0;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .scount{font-size:12px;color:var(--muted);font-family:var(--font-num)}
.more{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:16px;line-height:1}
.more:hover,.scard.open .more{background:var(--surface-2);color:var(--ink)}
.smenu{position:absolute;right:4px;top:calc(100% + 4px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0 / .14);padding:4px;display:grid;min-width:132px}
.smenu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;font-size:14px}
.smenu button:hover{background:var(--surface-2)}
.smenu .del{color:var(--bad)}
.smenu .del.armed{background:var(--bad-bg);font-weight:500}
.addchip{border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));background:none;color:var(--accent);border-radius:8px;padding:6px 10px;font-size:14px;text-align:left}
.addchip:hover{background:var(--accent-soft)}
.addin{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.addin input{flex:1;min-width:6em;padding:5px 8px;border-color:var(--accent)}
.clist{padding:10px 0;border-top:1px solid var(--line)}
.clist:first-of-type{border-top:0;padding-top:0}
.clist-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:8px}
.clist-h b{font-size:14px}
.clist-h span{font-size:12px;color:var(--muted)}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipsrow .addchip{padding:3px 12px}
.chipsrow .addin{flex-basis:100%}
.tchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 3px 2px 10px;font-size:14px;background:var(--surface-2)}
.tchip button{border:0;background:none;color:var(--muted);min-width:22px;height:22px;border-radius:999px;font-size:13px;padding:0 4px}
.tchip button:hover{background:var(--bad-bg);color:var(--bad)}
.tchip .tname{color:var(--ink);font-size:14px;padding:0 2px;min-width:0;height:auto;border-radius:4px;cursor:text}
.tchip .tname:hover{background:none;color:var(--accent);text-decoration:underline dotted}
.ledit{flex-basis:100%}

@media (max-width:760px){
  .settabs{display:flex}
  .set2{grid-template-columns:1fr}
  .set2.show-people .veh,.set2.show-veh .ppl{display:none}
}
@media (max-width:420px){.scols{grid-template-columns:1fr}}

/* settings */
.set{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h2{margin:0 0 4px;font-size:16px}

.plist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pitem{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:14px;background:var(--surface-2)}
.pitem button{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%}
.pitem button:hover{background:var(--bad-bg);color:var(--bad)}
.slist{display:grid;border-top:1px solid var(--line)}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}

.sname{font-weight:500;font-size:15px;min-width:56px}
.scount{font-size:12px;color:var(--muted);font-family:var(--font-num)}
.sbtns{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.icon-btn.sm{width:28px;height:28px;font-size:14px}

.mini.del{color:var(--bad)}
.mini.armed{background:var(--bad-bg);border-color:var(--bad)}
.grp{font-size:12px;color:var(--muted);margin:8px 0 4px;letter-spacing:.06em}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow input{flex:1;min-width:100px}
input[type=text],input[type=date],input[type=time],textarea,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:56px}
.btn{border:0;border-radius:8px;padding:8px 16px;font-weight:500;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(10 14 13 / .45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.sheet{align-items:center}}
.card{background:var(--surface);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:720px){.card{border-radius:14px}}
.card h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 .x{margin-left:auto}
.fgrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.field input{width:100%}
.drange{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.drange input{width:auto;flex:1;min-width:140px;max-width:200px}

.tline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}

.tp{position:relative;display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 2px 0 6px;transition:border-color .12s}
.tp::before{content:"";position:absolute;left:6px;right:30px;top:50%;height:36px;transform:translateY(-50%);border-radius:8px;background:var(--surface);border:1px solid var(--line);pointer-events:none}
.tp.set{border-color:var(--accent)}
.tp.set::before{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tp:focus-within{border-color:var(--accent)}
.wheel{position:relative;height:108px;width:2.8em;overflow-y:auto;scroll-snap-type:y mandatory;padding-block:36px;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);cursor:ns-resize;outline:none}

<script>
const WD = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
const ds = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ds(d.getFullYear(), d.getMonth(), d.getDate()); };
const todayStr = () => { const d = new Date(); return ds(d.getFullYear(), d.getMonth(), d.getDate()); };
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const md = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

const S = {
  db: null, canWrite: true, jobs: new Map(), days: new Map(), trash: new Map(), km: new Map(), times: new Map(), me: null, meId: '',
  config: { staff: [], vehicles: [], extCompanies: [], carTypes: [], vehicleService: {}, accounts: [] }, view: 'day',
  month: (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })(),
  focus: '', loaded: { jobs: false, days: false, config: false }, scrolled: false
};
try { S.focus = localStorage.getItem('focus') || ''; const v = localStorage.getItem('view'); if (v) S.view = v; } catch (e) {}

/* ---------- data helpers ---------- */
const jobsOn = date => [...S.jobs.values()].filter(j => j.date === date).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.start || '99').localeCompare(String(b.start || '99')));
const leaveOn = date => new Set(S.days.get(date)?.leave || []);
const officeOn = date => new Set(S.days.get(date)?.office || []);
/* 車輛里程：目前里程＝這台車所有用車登記中最大的里程數 */
const kmFmt = n => n == null || n === '' || isNaN(n) ? '' : Number(n).toLocaleString('en-US');
const kmLogs = v => [...S.km.values()].filter(r => r.vehicle === v);
const odo = v => { let m = null; for (const r of kmLogs(v)) for (const x of [r.start, r.end]) if (x != null && x !== '' && !isNaN(x) && (m == null || +x > m)) m = +x; return m; };
const serviceKm = v => { const s = (S.config.vehicleService || {})[v]; return s == null || s === '' ? null : +s; };
const isDue = v => { const s = serviceKm(v), o = odo(v); return s != null && o != null && o >= s; };
const jobKm = (jid, v) => [...S.km.values()].find(r => r.jobId === jid && r.vehicle === v);
const isActive = p => p.active !== false;
const activeStaff = () => S.config.staff.filter(isActive);
const allNames = () => {
  const s = new Set(activeStaff().map(p => p.name));
  for (const j of S.jobs.values()) (j.people || []).forEach(p => s.add(p));
  return [...s];
};
const isOvernight = j => !!(j.start && j.end && toMin(j.end) < toMin(j.start));
const endMin = j => { const e = toMin(j.end); return e == null ? null : (isOvernight(j) ? e + 1440 : e); }; // 跨夜的結束時間加 24 小時
function pairStatus(a, b) {
  const as = toMin(a.start), ae = endMin(a), bs = toMin(b.start), be = endMin(b);
  if (as != null && ae != null && bs != null && be != null) return (as < be && bs < ae) ? 'clash' : 'ok';
  return 'check';
}
const RANK = { ok: 1, check: 2, clash: 3, leave: 4 };
function analyze(date) {
  const list = jobsOn(date).filter(j => !j.unattended);
  const leave = leaveOn(date);
  const flags = new Map(); const issues = [];
  const mark = (jid, key, st) => { if (!flags.has(jid)) flags.set(jid, {}); const f = flags.get(jid); if (!f[key] || RANK[st] > RANK[f[key]]) f[key] = st; };
  const scan = (field, kind) => {
    const m = new Map();
    list.forEach(j => (j[field] || []).forEach(n => { if (!m.has(n)) m.set(n, []); m.get(n).push(j); }));
    for (const [n, js] of m) {
      const key = kind + ':' + n;
      if (kind === 'p' && leave.has(n)) {
        issues.push({ lv: 'bad', t: `${n} 這天休假，但排在「${js.map(j => j.title).join('、')}」` });
        js.forEach(j => mark(j.id, key, 'leave'));
      }
      for (let i = 0; i < js.length; i++) for (let k = i + 1; k < js.length; k++) {
        const st = pairStatus(js[i], js[k]);
        mark(js[i].id, key, st); mark(js[k].id, key, st);
        const what = kind === 'p' ? n : `車輛 ${n}`;
        if (st === 'clash') issues.push({ lv: 'bad', t: `${what}：「${js[i].title}」和「${js[k].title}」時間重疊` });
        if (st === 'check') issues.push({ lv: 'check', t: `${what} 同天兩場（${js[i].title}、${js[k].title}），補上起訖時間就能自動確認` });
      }
    }
  };
  scan('people', 'p'); scan('vehicles', 'v');
  // 同一場同一個人不要同時排成「個人」又排在團隊裡，時間會重複計算
  list.forEach(j => { const mem = new Set((j.teams || []).flatMap(t => (t.members || []).filter(Boolean))); (j.people || []).filter(n => mem.has(n)).forEach(n => issues.push({ lv: 'check', t: `${n} 在「${j.title}」同時排成個人和團隊成員，請擇一` })); });
  [...officeOn(date)].filter(n => leave.has(n)).forEach(n => issues.push({ lv: 'bad', t: `${n} 這天同時排在公司和休假` }));
  jobsOn(date).forEach(j => (j.ext || []).filter(e => !e.ok && extFilled(e)).forEach(e => issues.push({ lv: 'bad', t: `「${j.title}」外調車輛「${extLabel(e)}」還沒確認` })));
  return { flags, issues };
}
// 地址：放在場次名稱右邊，地圖按鈕用 Google 地圖搜尋這個地址
const mapUrl = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
function addrHTML(j) {
  const a = (j.address || '').trim(); if (!a) return '';
  const pin = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
  return `<span class="jaddr">${EXPORTING ? '' : `<a class="mapbtn" data-act="map" href="${esc(mapUrl(a))}" target="_blank" rel="noopener" title="在地圖上開啟">${pin}地圖</a>`}<span class="addr">${esc(a)}</span></span>`;
}
function timeHTML(j) {
  const t = j.start ? (j.end ? `${j.start}–${isOvernight(j) ? '隔天' : ''}${j.end}` : j.start) : '';
  if (!t) return '<div class="jt"><span class="none">—</span></div>';
  return `<div class="jt">${esc(t)}</div>`;
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  $('#mlabel').textContent = `${S.month.y}年${S.month.m + 1}月`;
  const fs = $('#focus'); const names = activeStaff().filter(p => (p.group || '正職') === '正職').map(p => p.name);
  if (S.focus && S.config.staff.length && !names.includes(S.focus)) S.focus = '';
  fs.innerHTML = '<option value="">全部人員</option>' + names.map(n => `<option ${n === S.focus ? 'selected' : ''}>${esc(n)}</option>`).join('');
  document.body.classList.toggle('ro', S.canWrite === false);
  { const tb = $('#trashbtn'); if (tb) tb.hidden = !S.trash.size || S.canWrite === false; } { const eb = $('#exportbtn'); if (eb) eb.hidden = !can('export'); const kb = $('#kmbtn'); if (kb) kb.hidden = !can('km'); const pt = $('#tab-perm'); if (pt) pt.hidden = !can('admin'); } // 最近刪除、匯出只給有編輯權限的人

const WI = 36;
function timePick(id, val, label) {
  const [h, m] = (val || '').split(':');
  const hs = ['--', ...Array.from({ length: 24 }, (_, i) => pad(i))];
  const ms = Array.from({ length: 12 }, (_, i) => pad(i * 5));

  const col = (kind, list, cur, aria) => `<div class="wheel" data-tp="${kind}" data-v="${cur}" tabindex="0" role="listbox" aria-label="${label}${aria}">${list.map(x => `<div class="wi ${x === cur ? 'sel' : ''}" data-v="${x}" role="option">${x}</div>`).join('')}</div>`;
  return `<div class="tp ${h ? 'set' : ''}" id="${id}" role="group" aria-label="${label}時間">
    ${col('h', hs, h || '--', '（時）')}<b>:</b>${col('m', ms, m || '00', '（分）')}
    <button type="button" class="tp-x" data-act="tpclear" data-id="${id}" aria-label="清除${label}時間">×</button>
  </div>`;
}
function tpVal(id) {
  const el = document.getElementById(id); const h = el.querySelector('[data-tp=h]').dataset.v;
  return h && h !== '--' ? `${h}:${el.querySelector('[data-tp=m]').dataset.v || '00'}` : '';
}
function wheelTo(w, i, smooth) {
  const n = w.children.length; i = Math.max(0, Math.min(n - 1, i));
  w.scrollTo({ top: i * WI, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' });
}
function wheelCommit(w) {
  const i = Math.max(0, Math.min(w.children.length - 1, Math.round(w.scrollTop / WI)));
  [...w.children].forEach((c, k) => c.classList.toggle('sel', k === i));
  const v = w.children[i].dataset.v;
  if (v === w.dataset.v) return;
  w.dataset.v = v;
  const tp = w.closest('.tp'); tp.classList.toggle('set', tp.querySelector('[data-tp=h]').dataset.v !== '--');
  renderPicks();
}
function initWheels(root) {
  root.querySelectorAll('.wheel').forEach(w => {
    const idx = () => [...w.children].findIndex(c => c.dataset.v === w.dataset.v);
    w.scrollTop = Math.max(0, idx()) * WI;
    let t, acc = 0;
    w.addEventListener('scroll', () => {
      const i = Math.round(w.scrollTop / WI);
      [...w.children].forEach((c, k) => c.classList.toggle('sel', k === i));
      clearTimeout(t); t = setTimeout(() => wheelCommit(w), 110);
    });
    w.addEventListener('wheel', e => {
      e.preventDefault();

    w.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); wheelTo(w, Math.round(w.scrollTop / WI) + (e.key === 'ArrowDown' ? 1 : -1), true); }
    });
  });
}

function rangeDates(a, b) {
  const out = [a]; if (!b || b <= a) return out;
  let d = a; while (d < b && out.length < 63) { d = addDays(d, 1); out.push(d); }
  return out;
}

/* ---------- 休假 / 公司 editor ---------- */
let L = null;
function openLeave(date, kind = 'leave') {
  const label = kind === 'office' ? '在公司' : '休假';
  L = { date, kind, leave: [...(kind === 'office' ? officeOn(date) : leaveOn(date))] };
  const regular = activeStaff().filter(p => (p.group || '正職') === '正職').map(p => p.name);
  const names = regular; // 休假和公司都只從正職挑選（以前選過的支援人員仍會列出，方便取消）
  const sh = $('#sheet');
  const draw = () => {
    const assigned = new Set(jobsOn(date).flatMap(j => j.unattended ? [] : (j.people || [])));
    const other = kind === 'office' ? leaveOn(date) : officeOn(date);
    sh.querySelector('#lv-picks').innerHTML = [...new Set([...names, ...L.leave])].map(n => {
      const on = L.leave.includes(n);
      const hint = [assigned.has(n) ? '當天有排' : '', other.has(n) ? (kind === 'office' ? '休假' : '在公司') : ''].filter(Boolean).join('、');
      const bad = on && (kind === 'leave' ? (assigned.has(n) || other.has(n)) : other.has(n));
      return `<button type="button" class="pick ${bad ? 'leave' : ''}" data-act="lvpick" data-name="${esc(n)}" aria-pressed="${on}"><b>${esc(n)}</b>${hint ? `<i>${hint}</i>` : ''}</button>`;
    }).join('') || '<span class="hint">到「人員管理」新增正職人員。</span>';
  };
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="lv-h">
    <h2 id="lv-h">${md(date)} 週${WD[parseD(date).getDay()]} ${label}<button class="icon-btn x" data-act="close" aria-label="關閉">×</button></h2>
    ${kind === 'office' ? '<p class="hint" style="margin:0">勾選這天留在公司的正職。</p>' : ''}
    <div class="picks" id="lv-picks"></div>
    <div class="acts"><span class="sp"></span><button class="btn" data-act="lvsave" id="b-lv">儲存</button></div>
  </div>`;
  sh.hidden = false; L.draw = draw; draw();
}

let toastT;
function toast(msg, undo) {
  const el = $('#toast'); el.innerHTML = '';
  const sp = document.createElement('span'); sp.textContent = msg; el.appendChild(sp);
  if (undo) { const b = document.createElement('button'); b.className = 'undo'; b.textContent = '復原'; b.onclick = () => { el.hidden = true; undo(); }; el.appendChild(b); }
  el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, undo ? 10000 : 2200);
}

/* ---------- 刪除先進「最近刪除」，30 天內都能復原 ---------- */
async function trashJobs(jobs, msg) {
  jobs = jobs.filter(Boolean); if (!jobs.length) return false;
  const batch = Date.now().toString(36), now = Date.now();
  const old = [...S.trash.values()].filter(t => now - (t.deletedAt || 0) > 30 * 864e5);
  const ok = await write(async () => {
    for (const j of jobs) {
      const { id, ...data } = j;
      await S.db.doc('trash/' + id).set({ job: data, deletedAt: now, batch });
      await S.db.doc('jobs/' + id).delete();
    }
    for (const t of old) await S.db.doc('trash/' + t.id).delete();
  });
  if (ok) toast(msg, () => restoreJobs(jobs.map(j => j.id), jobs));
  return ok;
}
async function restoreJobs(ids, captured) {
  const cap = new Map((captured || []).map(j => { const { id, ...job } = j; return [id, { id, job }]; }));
  const items = ids.map(id => S.trash.get(id) || cap.get(id)).filter(Boolean);
  if (!items.length) { toast('找不到要復原的場次'); return; }
  await write(async () => {
    for (const t of items) { await S.db.doc('jobs/' + t.id).set(t.job); await S.db.doc('trash/' + t.id).delete(); }
  }, items.length > 1 ? `已復原 ${items.length} 個場次` : `已復原「${items[0].job.title}」`);
  if (TR) openTrash();
}
let TR = false;
function openTrash() {
  if (S.canWrite === false) return;
  TR = true;
  const list = [...S.trash.values()].sort((a, b) => b.deletedAt - a.deletedAt);
  const batches = []; const seen = new Map();
  list.forEach(t => { if (!seen.has(t.batch)) { seen.set(t.batch, []); batches.push(seen.get(t.batch)); } seen.get(t.batch).push(t); });
  const when = ms => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const sh = $('#sheet');
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="tr-h">
    <h2 id="tr-h">最近刪除<button class="icon-btn x" data-act="trclose" aria-label="關閉">×</button></h2>
    <p class="hint" style="margin:0">刪除的場次會保留 30 天，按「復原」就會放回原本的日期。</p>
    ${batches.length ? `<div class="trlist">${batches.map(b => {
      const dates = [...new Set(b.map(t => t.job.date))].sort();
      const range = dates.length > 1 ? `${md(dates[0])}–${md(dates.at(-1))}（${dates.length} 天）` : md(dates[0]);
      return `<div class="tritem">
        <div class="trmain"><b>${esc(b[0].job.title || '（未命名）')}</b><span>${range}</span></div>
        <span class="trwhen">${when(b[0].deletedAt)} 刪除</span>
        ${S.canWrite === false ? '' : `<button class="btn sm" data-act="trrestore" data-ids="${esc(b.map(t => t.id).join(','))}">復原</button>`}
      </div>`; }).join('')}</div>` : '<p class="emptymsg">沒有刪除的場次。</p>'}
  </div>`;
  sh.hidden = false;
}

    <div class="teamed-h"><b>${esc(t.name)}</b><label>人數 <select data-tc aria-label="${esc(t.name)} 人數">${Array.from({ length: 50 }, (_, i) => `<option ${i + 1 === n ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></label><span class="hint">姓名可以不填</span></div>

function readTeams() {
  if (!F || !document.querySelector('#pick-t')) return;
  document.querySelectorAll('#pick-t .teamed').forEach(el => {
    const t = F.teams.find(x => x.name === el.dataset.team); if (!t) return;

    const vals = [...el.querySelectorAll('[data-tm]')].map(i => i.value.trim());
    t.members = Array.from({ length: t.count }, (_, i) => vals[i] ?? (t.members || [])[i] ?? '');

function teamTimeSummary(j, t) {
  const n = +t.count || 0; if (!n) return '';
  const rs = Array.from({ length: n }, (_, i) => timeOf(j.id, t.name + '#' + i));
  const got = rs.filter(Boolean); if (!got.length) return '';
  const txt = got.map(r => timeText(r));
  if (got.length === n && txt.every(x => x === txt[0])) return txt[0];
  return got.length === n ? '時間各不同' : `已填 ${got.length}/${n}`;
}
function memberTimes(j, t) {

/* ---------- SharePoint 清單與群組（Microsoft Graph） ---------- */
function graphBackend() {

  };

      const n = cols[k][lk]; if (!n || v === undefined) continue;
      const t = kinds[k][lk];
      if (DATE_KEYS[k]?.includes(lk)) o[n] = v ? midnight(v) : null;
      else if (BOOL_KEYS[k]?.includes(lk)) o[n] = t === 'number' ? (v ? 1 : 0) : t === 'text' ? (v ? '1' : '0') : !!v;
      else if (t === 'number') o[n] = (v === null || v === '' || isNaN(+v)) ? null : +v;
      else if (t === 'text') o[n] = v === null ? '' : String(v);
      else o[n] = v;
    }
    return o;
  };
  const L = k => `/sites/${site.id}/lists/${ids[k]}`;
  const listMsg = k => `沒有權限寫入「${LIST_NAMES[k]}」清單`;
  const guard = (k, p) => p.catch(e => {
    if (e.status === 403 && !['jobs', 'ext', 'days', 'staff', 'options', 'trash'].includes(k)) throw userErr(listMsg(k) + '，請管理員檢查你的群組。');
    throw e;
  });
  const userOf = u => u?.user ? { id: u.user.id || '', name: u.user.displayName || '', mail: u.user.email || '' } : { id: '', name: '', mail: '' };

    raw: call,
    async init() {

    },
    has: k => !!ids[k],
    hasCol: (k, f) => !!(cols[k] && cols[k][f]),
    async items(k) {
      if (!ids[k]) return [];
      const sel = Object.values(cols[k]).join(',');
      const rows = await all(`${L(k)}/items?$select=id,createdBy,lastModifiedBy,lastModifiedDateTime&$expand=fields($select=${sel})&$top=999`);
      return rows.map(r => {
        const f = {};
        for (const [lk, n] of Object.entries(cols[k])) { let v = r.fields?.[n]; if (DATE_KEYS[k]?.includes(lk)) v = toDs(v); else if (BOOL_KEYS[k]?.includes(lk)) v = toBool(v); f[lk] = v; }
        return { id: r.id, f, author: userOf(r.createdBy), editor: userOf(r.lastModifiedBy), at: Date.parse(r.lastModifiedDateTime || '') || 0 };
      });
    },
    async create(k, f) { if (!ids[k]) throw userErr(`還沒建立「${LIST_NAMES[k]}」清單，請管理員照設定紀錄建立。`); const r = await guard(k, call('POST', `${L(k)}/items`, { fields: out(k, f) })); return r.id; },
    async patch(k, id, f) { await guard(k, call('PATCH', `${L(k)}/items/${id}/fields`, out(k, f))); },
    async remove(k, id) { await guard(k, call('DELETE', `${L(k)}/items/${id}`)); },
    /* 帳號與群組 */
    async me() { const u = await call('GET', '/me?$select=id,displayName,mail,userPrincipalName'); return { id: u.id, name: u.displayName || '', mail: u.mail || '', upn: u.userPrincipalName || '' }; },
    async myGroups(gids) { if (!gids.length) return []; const r = await call('POST', '/me/checkMemberGroups', { groupIds: gids }); return r.value || []; },
    async members(gid) {
      const rows = await all(`/groups/${gid}/members?$select=id,displayName,mail,userPrincipalName&$top=999`);
      return rows.filter(x => !x['@odata.type'] || /user$/i.test(x['@odata.type'])).map(x => ({ id: x.id, name: x.displayName || '', mail: x.mail || '', upn: x.userPrincipalName || '' }));
    },
    async addMember(gid, uid) {
      try { await call('POST', `/groups/${gid}/members/$ref`, { '@odata.id': `https://graph.microsoft.com/v1.0/directoryObjects/${uid}` }, { scopes: ADMIN_SCOPES }); }
      catch (e) { if (e.status === 400 && /already exist/i.test(e.message)) return; throw e; }
    },
    async removeMember(gid, uid) {
      try { await call('DELETE', `/groups/${gid}/members/${uid}/$ref`, null, { scopes: ADMIN_SCOPES }); }
      catch (e) { if (e.status === 404) return; throw e; }
    }
  };
}

/* ---------- 示範模式（網址加 ?demo）：資料只在這個分頁，不會存到任何地方 ---------- */
function memoryBackend(seed) {
  const db = {}; let n = 1;
  const me = seed.users[0];
  for (const [k, rows] of Object.entries(seed.lists)) db[k] = rows.map(f => ({ id: String(n++), f: { ...f }, author: me, editor: me, at: Date.now() }));
  const groups = clone(seed.groups);
  const lag = () => new Promise(r => setTimeout(r, 40));
  return {
    async init() {}, has: k => !!db[k], hasCol: () => true, raw: async () => ({ value: [] }),
    async items(k) { await lag(); return (db[k] || []).map(r => ({ ...r, f: { ...r.f } })); },
    async create(k, f) { await lag(); const id = String(n++); (db[k] ||= []).push({ id, f: { ...f }, author: me, editor: me, at: Date.now() }); return id; },
    async patch(k, id, f) { await lag(); const r = (db[k] || []).find(x => x.id === id); if (!r) throw Object.assign(new Error('找不到資料'), { code: 'error' }); Object.assign(r.f, f); r.editor = me; r.at = Date.now(); },
    async remove(k, id) { await lag(); db[k] = (db[k] || []).filter(x => x.id !== id); },
    async me() { return { ...me, upn: me.mail }; },
    async myGroups(gids) { return gids.filter(g => (groups[g] || []).includes(me.id)); },
    async members(gid) { await lag(); return (groups[gid] || []).map(id => seed.users.find(u => u.id === id)).filter(Boolean).map(u => ({ ...u, upn: u.mail })); },
    async addMember(gid, uid) { await lag(); (groups[gid] ||= []); if (!groups[gid].includes(uid)) groups[gid].push(uid); },
    async removeMember(gid, uid) { await lag(); groups[gid] = (groups[gid] || []).filter(x => x !== uid); }
  };
}

    M.trash = new Map();
    for (const r of tr) { try { const t = JSON.parse(textOf(r.f.data)); if (t && t.id && t.job) M.trash.set(t.id, { itemId: r.id, data: { job: t.job, deletedAt: t.deletedAt, batch: t.batch } }); } catch (_) {} }
    // 工時：一人一場一筆。SharePoint 只會給你看得到的那幾筆（沒有「看大家時間」的人只拿得到自己建的）
    M.times = new Map();
    for (const r of tm) {
      const f = r.f; if (!f.job || !f.name) continue;
      const slot = num(f.slot); const id = f.job + '__' + (slot != null ? f.name + '#' + slot : f.name);
      const data = { jobId: f.job, date: f.date || '', name: f.name, ...(slot != null ? { slot, member: f.member || '' } : {}), start: f.start || '', end: f.end || '', by: r.editor.name || r.author.name, byId: r.author.id, at: r.at };
      if (!M.times.has(id)) M.times.set(id, { all: [] });
      M.times.get(id).all.push({ itemId: r.id, authorId: r.author.id, at: r.at, data });
    }
    // 同一人同一場有好幾筆時（例如排班編輯改過別人填的），畫面挑最新、而且填寫人有資格的那筆
    for (const t of M.times.values()) { t.all.sort((a, b) => b.at - a.at); t.data = { ...t.all[0].data, alts: t.all.slice(1).map(x => x.data) }; }
    M.mileage = new Map(km.map(r => { const f = r.f; return ['k' + r.id, { itemId: r.id, data: { kind: f.kind === 'misc' ? 'misc' : 'job', jobId: f.job || null, vehicle: f.vehicle || '', date: f.date || '', tStart: f.tStart || '', tEnd: f.tEnd || '', start: num(f.start), end: num(f.end), driver: f.driver || '', note: f.note || '', by: r.editor.name || r.author.name } }]; }));
    if (Date.now() - accAt > 5 * 60e3) await loadAccounts();
    return true;
  }
  async function sync() {
    if (syncing) return syncing;
    syncing = (async () => {
      try { if (await load()) { emitAll(); setStatus(DEMO ? '示範模式（資料不會儲存）' : S.canWrite === false ? '僅可檢視' : '已同步'); } }
      catch (e) { console.warn(e); setStatus('連線中斷，稍後自動重試', true); }
      finally { syncing = null; }
    })();
    return syncing;
  }
  const later = () => { clearTimeout(syncT); syncT = setTimeout(sync, 2500); };
  async function w(fn) { busy++; gen++; try { return await fn(); } finally { busy--; gen++; later(); } }

  /* 場次與外調車輛 */
  async function syncExt(id, date, list) {
    const cur = M.ext.get(id) || [];
    const want = (list || []).filter(e => e && (e.company || e.type || e.plate || e.driver || e.phone || e.name))
      .map(e => ({ company: e.company || e.name || '', type: e.type || '', plate: e.plate || '', driver: e.driver || '', phone: e.phone || '', ok: !!e.ok }));
    const oldDate = M.jobs.get(id)?.data.date;
    const next = [];
    await pool(want.map((v, i) => async () => {
      const c = cur[i];
      if (c) { if (JSON.stringify(c.v) !== JSON.stringify(v) || oldDate !== date) await B.patch('ext', c.itemId, { ...v, key: id, date }); next[i] = { itemId: c.itemId, v }; }
      else next[i] = { itemId: await B.create('ext', { ...v, key: id, date }), v };
    }));
    await pool(cur.slice(want.length).map(c => () => B.remove('ext', c.itemId)));
    if (next.length) M.ext.set(id, next); else M.ext.delete(id);
  }
  async function setJob(id, data) {
    const rec = M.jobs.get(id);
    const teams = (data.teams || []).filter(t => t && t.name);
    const f = { title: data.title || '', key: id, date: data.date || '', start: data.start || '', end: data.end || '', timeNote: data.timeNote || '', address: data.address || '', teams: teams.length ? JSON.stringify(teams) : '', people: joinNames(data.people), leaders: joinNames(data.leaders), vehicles: joinNames(data.vehicles), unattended: !!data.unattended, note: data.note || '', order: data.order ?? 0 };
    if (teams.length && !B.hasCol('jobs', 'teams')) throw userErr('「場次」清單還沒有 Teams 欄位，團隊存不進去。請管理員照設定紀錄新增欄位。');
    let itemId = rec?.itemId;
    if (itemId) await B.patch('jobs', itemId, f); else itemId = await B.create('jobs', f);
    await syncExt(id, f.date, data.ext);
    M.jobs.set(id, { itemId, data: jobOf(f, M.ext.get(id)) });
    emit('jobs');
  }
  async function delJob(id) {
    const rec = M.jobs.get(id); if (!rec) return;
    await pool((M.ext.get(id) || []).map(c => () => B.remove('ext', c.itemId)));
    await B.remove('jobs', rec.itemId);
    M.ext.delete(id); M.jobs.delete(id); emit('jobs');
  }
  /* 每日休假與公司 */
  async function setDay(id, data) {
    const rec = M.days.get(id);
    const f = { key: id, date: id, leave: joinNames(data.leave), office: joinNames(data.office) };
    let itemId = rec?.itemId;
    if (itemId) await B.patch('days', itemId, f); else itemId = await B.create('days', f);
    M.days.set(id, { itemId, data: { leave: splitNames(f.leave), office: splitNames(f.office) } }); emit('days');
  }
  /* 最近刪除 */
  async function setTrash(id, data) {
    if (!B.has('trash')) return; // 沒建「最近刪除」清單時，刪除後只能用畫面上的「復原」或 SharePoint 資源回收筒
    const rec = M.trash.get(id);
    const f = { title: data.job?.title || '（未命名）', data: JSON.stringify({ id, ...data }) };
    let itemId = rec?.itemId;
    if (itemId) await B.patch('trash', itemId, f); else itemId = await B.create('trash', f);
    M.trash.set(id, { itemId, data: clone(data) }); emit('trash');
  }
  async function delTrash(id) { const rec = M.trash.get(id); if (!rec) return; await B.remove('trash', rec.itemId); M.trash.delete(id); emit('trash'); }
  /* 工時 */
  async function setTime(id, data) {
    const rec = M.times.get(id), mine = rec?.all.find(x => x.authorId === ME.id);
    const f = { name: data.name || '', job: data.jobId || '', date: data.date || '', slot: data.slot != null ? data.slot : null, member: data.member || '', start: data.start || '', end: data.end || '' };
    if (data.slot != null && !B.hasCol('times', 'slot')) throw userErr('「工時」清單還沒有 Slot 欄位，團隊成員的時間存不進去。');
    // 只改自己建的那筆；別人建的不動，另外新增一筆自己的（SharePoint 記錄的建立者才會是自己）
    let itemId = mine?.itemId;
    if (itemId) {
      try { await B.patch('times', itemId, f); }
      catch (e) { if (e.status === 404) itemId = null; else throw e; }
    }
    if (!itemId) itemId = await B.create('times', f);
    const d = { ...clone(data), by: ME.name, byId: ME.id, at: Date.now() }; delete d.alts;
    const others = (rec?.all || []).filter(x => x.itemId !== itemId);
    M.times.set(id, { all: [{ itemId, authorId: ME.id, at: d.at, data: d }, ...others], data: { ...d, alts: others.map(x => x.data) } }); emit('times');
  }
  async function delTime(id) {
    const rec = M.times.get(id); if (!rec) return;
    await pool(rec.all.map(x => () => B.remove('times', x.itemId).catch(e => { if (e.status !== 404) throw e; })));
    M.times.delete(id); emit('times');
  }
  /* 用車里程 */
  async function setKm(id, data) {
    const rec = M.mileage.get(id);
    const f = { vehicle: data.vehicle || '', kind: data.kind === 'misc' ? 'misc' : 'job', job: data.jobId || '', date: data.date || '', tStart: data.tStart || '', tEnd: data.tEnd || '', start: data.start, end: data.end, driver: data.driver || '', note: data.note || '' };
    let itemId = rec?.itemId;
    if (itemId) await B.patch('mileage', itemId, f); else itemId = await B.create('mileage', f);
    M.mileage.delete(id); M.mileage.set('k' + itemId, { itemId, data: { ...clone(data), by: ME.name } }); emit('mileage');
  }
  async function delKm(id) { const rec = M.mileage.get(id); if (!rec) return; await B.remove('mileage', rec.itemId); M.mileage.delete(id); emit('mileage'); }
  /* 人員名單與車輛選單：比對前後差異，只改有變的那幾筆 */
  async function setConfig(next) {
    const items = M.staff;
    const byName = new Map(items.map(s => [s.name, s]));
    const wantNames = (next.staff || []).map(p => p.name);
    const removed = items.filter(s => !wantNames.includes(s.name));
    const added = wantNames.filter(n => !byName.has(n));
    if (removed.length === 1 && added.length === 1) { // 改名：沿用同一筆，保留 Email 等其他欄位
      const s = removed[0]; await B.patch('staff', s.itemId, { name: added[0] });
      byName.delete(s.name); s.name = added[0]; byName.set(s.name, s); removed.length = 0;
    }
    await pool(removed.filter(s => s.active !== false).map(s => async () => { await B.patch('staff', s.itemId, { active: false }); s.active = false; })); // 停用，舊班表的名字照留
    const canLeader = B.hasCol('staff', 'leader');
    if (!canLeader && (next.staff || []).some(p => p.leader && p.leader !== (byName.get(p.name)?.leader || ''))) throw userErr('「人員」清單還沒有 Leader 欄位，負責人存不進去。請管理員照設定紀錄新增欄位。');
    await pool((next.staff || []).map((p, i) => async () => {
      const group = p.group || '正職', order = i + 1, active = p.active !== false, leader = p.leader || '', s = byName.get(p.name);
      if (!s) {
        const f = { name: p.name, group, order, active, ...(canLeader && leader ? { leader } : {}) };
        const id = await B.create('staff', f); items.push({ itemId: id, email: '', leader, ...f }); return;
      }
      const ch = {};
      if (s.active !== active) ch.active = active;
      if (s.group !== group) ch.group = group;
      if (s.order !== order) ch.order = order;
      if (canLeader && (s.leader || '') !== leader) ch.leader = leader;
      if (Object.keys(ch).length) { await B.patch('staff', s.itemId, ch); Object.assign(s, ch); }
    }), 5);
    const svc = next.vehicleService || {}, canSvc = B.hasCol('options', 'serviceKm');
    for (const [k, cat] of OPT_CATS) {
      const cur = M.opts.filter(o => o.cat === cat); const want = next[k] || [];
      const gone = cur.filter(o => !want.includes(o.name)); const fresh = want.filter(n => !cur.some(o => o.name === n));
      if (gone.length === 1 && fresh.length === 1) { const o = gone[0]; await B.patch('options', o.itemId, { name: fresh[0] }); o.name = fresh[0]; gone.length = 0; }
      await pool(gone.map(o => async () => { await B.remove('options', o.itemId); M.opts = M.opts.filter(x => x !== o); }));
      await pool(want.map((n, i) => async () => {
        const o = M.opts.find(x => x.cat === cat && x.name === n), order = i + 1;
        const sk = cat === '公司車輛' ? num(svc[n]) : null;
        if (sk && !canSvc) throw userErr('「車輛選項」清單還沒有 ServiceKm 欄位，保養里程存不進去。請管理員照設定紀錄新增欄位。');
        if (!o) { const id = await B.create('options', { name: n, cat, order, ...(canSvc && sk ? { serviceKm: sk } : {}) }); M.opts.push({ itemId: id, name: n, cat, order, serviceKm: sk }); return; }
        const ch = {};
        if (o.order !== order) ch.order = order;
        if (canSvc && cat === '公司車輛' && (o.serviceKm || null) !== sk) ch.serviceKm = sk;
        if (Object.keys(ch).length) { await B.patch('options', o.itemId, ch); Object.assign(o, ch); }
      }), 5);
    }
    if (next.accounts) await setAccountsReal(next.accounts);
    emit('config');
  }
  /* 權限管理頁：打勾＝加入群組；對應排班人員＝寫進人員清單的 Email 欄 */
  async function setAccountsReal(list) {
    let changed = false;
    for (const a of list) {
      const o = M.accounts.find(x => x.id === a.id); if (!o) continue;
      const curStaff = staffOfMail(o.mail, o.upn);
      if ((a.staff || '') !== curStaff) {
        if (!B.hasCol('staff', 'email')) throw userErr('「人員」清單還沒有 Email 欄位，沒辦法對應排班人員。請管理員照設定紀錄新增欄位。');
        const mail = o.mail || o.upn;
        if (!mail) throw userErr(`${o.name} 的帳號沒有電子郵件，沒辦法對應。`);
        for (const s of M.staff.filter(s => s.email && [lc(o.mail), lc(o.upn)].includes(lc(s.email)))) { await B.patch('staff', s.itemId, { email: '' }); s.email = ''; }
        const s = M.staff.find(x => x.name === a.staff);
        if (s) { await B.patch('staff', s.itemId, { email: mail }); s.email = mail; }
        changed = true;
      }
      const add = a.perms.filter(p => !o.perms.includes(p)), del = o.perms.filter(p => !a.perms.includes(p));
      for (const p of [...add, ...del]) if (!GID[p]) throw userErr(`config.js 還沒填「${PERM_LABEL[p]}」群組的識別碼，這一格暫時不能改。`);
      try {
        for (const p of add) { await B.addMember(GID[p], a.id); changed = true; }
        for (const p of del) { await B.removeMember(GID[p], a.id); changed = true; }
      } catch (e) {
        if (e.status === 403 || e.status === 401) throw userErr('沒有修改群組的權限。要在這一頁改權限，帳號必須是 Microsoft 365 管理員，或是這些「班表-」群組的擁有者。');
        throw e;
      }
    }
    if (changed) { await loadMyPerms(); await loadAccounts(); }
  }
  const handlers = {
    jobs: { set: setJob, update: (id, p) => { const r = M.jobs.get(id); if (!r) throw Object.assign(new Error('找不到這個場次，可能已被別人刪除'), { code: 'error' }); return setJob(id, { ...r.data, ...p }); }, delete: delJob },
    days: { set: setDay, update: (id, p) => setDay(id, { ...(M.days.get(id)?.data || {}), ...p }), delete: async () => {} },
    trash: { set: setTrash, update: (id, p) => setTrash(id, { ...(M.trash.get(id)?.data || {}), ...p }), delete: delTrash },
    times: { set: setTime, update: (id, p) => setTime(id, { ...(M.times.get(id)?.data || {}), ...p }), delete: delTime },
    mileage: { set: setKm, update: (id, p) => setKm(id, { ...(M.mileage.get(id)?.data || {}), ...p }), delete: delKm },
    config: { set: (_, next) => setConfig(next), update: (_, p) => setConfig({ ...cfg(), ...p }), delete: async () => {} }
  };
  const docRef = (c, id) => ({
    id,
    set: data => w(() => handlers[c].set(id, data)),
    update: data => w(() => handlers[c].update(id, data)),
    delete: () => w(() => handlers[c].delete(id)),
    onSnapshot: cb => { subs[c].push(cb); if (last[c] !== undefined) cb(snapOf(c)); return () => {}; }
  });
  return {
    collection: c => ({ doc: id => docRef(c, id || newId()), onSnapshot: cb => { subs[c].push(cb); if (last[c] !== undefined) cb(snapOf(c)); return () => {}; } }),
    doc: path => { const [c, id] = path.split('/'); return docRef(c, id); },
    async start() {
      await loadMyPerms();
      if (!(await load())) await load();
      if (!accAt) await loadAccounts();
      emitAll(true);
      setInterval(() => { if (document.visibilityState === 'visible' && !busy) sync(); }, Math.max(15, +SC.pollSeconds || 30) * 1000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
    }
  };
}

/* ---------- 錯誤訊息翻成看得懂的話 ---------- */
function explain(e) {
  if (e && e.userMsg) return e.userMsg;
  const m = String((e && (e.errorMessage || e.message)) || e || '');
  if (/AADSTS65001|consent_required|AADSTS90094/i.test(m)) return '這個 App 的權限還沒核准。請管理員到 Microsoft Entra 系統管理中心 → 應用程式註冊 → 排班表 → API 權限，按「代表 … 授與管理員同意」。';
  if (/AADSTS50011|redirect_uri/i.test(m)) return '登入網址不符。請在應用程式註冊的「驗證」裡加入這個重新導向 URI：' + redirectUri();
  if (/AADSTS700016|AADSTS90002|AADSTS900023/i.test(m)) return '找不到這個 App 或公司，請檢查 config.js 的 clientId 和 tenantId。';
  if (/user_cancelled|popup_window_error|block/i.test(m)) return '登入視窗被關掉或擋下了，請重新整理頁面再登入一次。';
  return '無法連線：' + m;
}

/* ---------- boot ---------- */
render();
(async () => {
  try {
    let B;
    if (DEMO) B = memoryBackend(demoSeed());
    else {
      if (isBlank(SC.tenantId) || isBlank(SC.clientId) || isBlank(SC.siteUrl)) {
        S.dbMsg = '還沒設定連線資訊。請照指南填好 config.js 的 tenantId、clientId、siteUrl。<br>想先看看畫面，可以在網址最後加上 <b>?demo</b>。';
        setStatus('未設定', true); render(); return;
      }
      S.dbMsg = '正在用公司帳號登入…'; render();
      await initAuth();
      await getToken();
      S.dbMsg = '正在讀取排班資料…'; render();
      B = graphBackend();
      await B.init();
    }
    const me = await B.me();
    S.meId = me.id;
    const db = makeDb(B, me);
    db.collection('jobs').onSnapshot(snap => { S.jobs = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); S.loaded.jobs = true; refresh(); });
    db.collection('days').onSnapshot(snap => { S.days = new Map(snap.docs.map(d => [d.id, d.data()])); S.loaded.days = true; refresh(); });
    db.collection('times').onSnapshot(snap => { S.times = new Map(snap.docs.map(d => [d.id, d.data()])); refresh(); });
    db.collection('mileage').onSnapshot(snap => { S.km = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); refresh(); if (KML) openKmList(); else if (KM) kmInfo(); });
    db.collection('trash').onSnapshot(snap => {
      S.trash = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
      const b = $('#trashbtn'); b.hidden = !S.trash.size || S.canWrite === false; b.textContent = `最近刪除 ${S.trash.size}`;
      if (TR) openTrash();
    });
    db.doc('config/main').onSnapshot(snap => {
      const c = snap.exists ? snap.data() : {};
      S.config = { staff: c.staff || [], vehicles: c.vehicles || [], extCompanies: c.extCompanies || [], carTypes: c.carTypes || [], vehicleService: c.vehicleService || {}, accounts: c.accounts || [] };
      applyMe(); fillMeSelect();
      S.loaded.config = true; refresh();
    });
    S.db = db;
    await db.start();
    setStatus(DEMO ? '示範模式（資料不會儲存）' : S.canWrite === false ? '僅可檢視' : '已同步');
    render();
  } catch (e) {
    console.error(e);
    S.dbMsg = esc(explain(e)); setStatus('未連線', true); render();
  }
})();

function refresh() {
  // keep focus/scroll inside open sheet; just re-render the page and refresh pick hints
  const keep = ['ren-input', 'add-in', 'ls-input'].map(id => { const el = document.getElementById(id); return el && { id, v: el.value, f: document.activeElement === el }; }).filter(Boolean);
  const y = scrollY, was = S.scrolled; render();
  keep.forEach(k => { const el = document.getElementById(k.id); if (el) { el.value = k.v; if (k.f) el.focus(); } }); if (was) scrollTo(0, y); if (F) renderPicks(); if (L && L.draw) L.draw();
}
